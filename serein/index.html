<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Serein</title>
<meta name="description" content="Study the repeat. Rebuild its stitch. A quiet tile pattern game.">
<meta name="theme-color" content="#f3eee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serein">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/*
  Serein: a quiet pattern room.
  Color: paper #f3eee6, paper-deep #e7e0d4, ink #24302c, muted #5c675f, line #d5cdc0, clay #9a5340, gold #a8843e.
  Type: Fraunces italic names the things you look at (titles, chapters, captions); Outfit runs the controls. Sentence case only.
  Layout: header with the name centered; the cloth and yours side by side at one scale; a cross-stitch counter;
  the stitch on a bench between a tool rail and a facing pad; a tray holding tiles and glazes.
  Boldness lives in two places: the inlaid title on the room and the stitch counter.
*/
:root {
  --paper: #f3eee6;
  --paper-deep: #e7e0d4;
  --ink: #24302c;
  --muted: #5c675f;
  --line: #d5cdc0;
  --clay: #9a5340;
  --gold: #a8843e;
  --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --shadow-cloth: 0 0 0 1px rgb(36 48 44 / 0.06), 0 18px 40px -24px rgb(36 48 44 / 0.28);
  --shadow-quiet: 0 0 0 1px rgb(36 48 44 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  color-scheme: light;
}
html {
  box-sizing: border-box;
  height: 100%;
  background: var(--paper);
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:disabled {
  cursor: default;
}
:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
}
svg {
  display: block;
}
figure {
  margin: 0;
}
h1,
h2 {
  text-wrap: balance;
}
p {
  text-wrap: pretty;
}
[hidden] {
  display: none !important;
}

html,
body,
#app {
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
#app {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#app::-webkit-scrollbar {
  display: none;
}
.page {
  max-width: 64rem;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 16px;
  display: flex;
  flex-direction: column;
}

/* ---------- header and shared controls */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 52px;
}
.group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 4px;
  border-radius: 999px;
  font-size: 15px;
}
.link svg,
.round svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.link svg {
  width: 16px;
  height: 16px;
}
.round {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  transition: transform 0.15s var(--ease), background 0.2s, color 0.2s;
}
.round svg {
  width: 20px;
  height: 20px;
}
.round.bare {
  background: none;
  box-shadow: none;
}
.round[aria-pressed="true"],
.round.on {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
}
.round:disabled {
  opacity: 0.35;
}
.round.glow {
  animation: glow 1.6s ease-in-out infinite;
}
@keyframes glow {
  50% {
    box-shadow: 0 0 0 6px rgb(168 132 62 / 0.35);
  }
}
.link:active,
.round:active,
.pill:active,
.dot-btn:active,
.swatch:active,
.face:active,
.go:active,
.pal:active {
  transform: scale(0.96);
}
.pill {
  min-height: 44px;
  padding: 0 20px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  font-size: 15px;
  transition: transform 0.15s var(--ease), background 0.2s;
}
.pill.ink {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
  font-weight: 500;
}
.pill.wide {
  width: 100%;
}
.pill.plain {
  background: none;
  box-shadow: none;
}
.pill.warn {
  background: var(--clay);
  color: var(--paper);
  box-shadow: none;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- type */
.title {
  margin: 4px 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 44px;
  line-height: 1.05;
}
.small {
  font-size: 14px;
  color: var(--muted);
}
.num {
  font-variant-numeric: tabular-nums;
}

/* ---------- room */
.room {
  flex: 1;
  display: grid;
  align-content: center;
  gap: 36px;
  padding: 12px 0 8px;
}
@media (min-width: 900px) {
  .room {
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 64px;
  }
}
.intro {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.hero {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 600;
  font-size: clamp(76px, 24vw, 132px);
  line-height: 0.92;
  letter-spacing: -0.01em;
  color: var(--ink);
  animation: inlay 1.1s var(--ease) both;
}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .hero {
    background: var(--inlay) 0 0 / 0.86em 0.86em repeat, var(--ink);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-right: 0.08em;
  }
}
@keyframes inlay {
  from {
    background-position: -0.43em -0.43em;
    opacity: 0;
  }
}
.lede {
  margin: 12px 0 0;
  max-width: 22rem;
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.4;
  color: var(--muted);
}
.go {
  margin-top: 28px;
  width: min(100%, 340px);
  min-height: 64px;
  padding: 10px 22px;
  border-radius: 20px;
  background: var(--ink);
  color: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  transition: transform 0.15s var(--ease), background 0.2s;
}
.go:hover {
  background: #2e3c37;
}
.go-main {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.2;
}
.go-sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  opacity: 0.72;
}
.ways {
  margin-top: 10px;
  width: min(100%, 340px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.ways .pill {
  padding: 0 8px;
}
.intro > .small {
  margin: 16px 0 0;
}
.today {
  display: block;
  width: 100%;
  max-width: 30rem;
  justify-self: center;
  text-align: left;
}
.frame {
  display: block;
  position: relative;
  border-radius: 18px;
  background: var(--paper-deep);
  padding: 8px;
  box-shadow: var(--shadow-cloth);
}
.frame.tight {
  padding: 5px;
  border-radius: 16px;
}
.frame .inner {
  display: block;
  border-radius: 11px;
  overflow: hidden;
}
.frame svg {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
}
.today-cap {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  padding: 0 4px;
}
.cap {
  font-family: var(--serif);
  font-style: italic;
  font-size: 19px;
}

/* ---------- play */
.play-page {
  max-width: 34rem;
  gap: 12px;
}
.play-top {
  display: grid;
  grid-template-columns: 96px 1fr 96px;
}
.play-top > .round.bare {
  justify-self: start;
  margin-left: -8px;
}
.play-top > .group {
  justify-self: end;
}
.heading {
  min-width: 0;
  text-align: center;
  line-height: 1.15;
}
.name {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--muted);
}
.sub.urgent {
  color: var(--clay);
}
.timer {
  height: 3px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
.timer i {
  display: block;
  height: 100%;
  background: var(--ink);
  transform-origin: left;
}
.timer.urgent i {
  background: var(--clay);
}
.timer.held i {
  background: var(--gold);
}
.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.compare.zen {
  display: block;
}
.compare figcaption {
  position: absolute;
  left: 11px;
  bottom: 11px;
  padding: 1px 10px 2px;
  border-radius: 999px;
  background: rgb(243 238 230 / 0.92);
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
  line-height: 1.4;
  pointer-events: none;
}
.frame.held {
  box-shadow: 0 0 0 2px var(--gold), var(--shadow-cloth);
}
.inner.wide svg {
  aspect-ratio: 2;
}
.counter {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
  min-height: 12px;
}
.counter svg {
  width: 11px;
  height: 11px;
  fill: none;
  stroke: var(--line);
  stroke-width: 2.2;
  stroke-linecap: round;
  transition: stroke 0.3s;
}
.counter svg.on {
  stroke: var(--ink);
}
.counter.held svg {
  stroke: var(--gold);
  animation: stitch 0.45s var(--ease) both;
  animation-delay: calc(var(--k) * 45ms);
}
@keyframes stitch {
  from {
    transform: scale(0.2) rotate(-90deg);
  }
}
.note {
  margin: 0;
  text-align: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
}
.bench {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 80px;
  gap: 10px;
  align-items: center;
}
.rail {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bench.done .rail,
.bench.done .pad {
  visibility: hidden;
}
.stitch {
  width: 100%;
  max-width: 270px;
  justify-self: center;
  display: grid;
  gap: 4px;
  padding: 6px;
  border-radius: 16px;
  background: var(--line);
  touch-action: none;
  transition: box-shadow 0.4s;
}
.stitch.whole {
  box-shadow: 0 0 0 2px var(--gold);
}
.cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.15s var(--ease);
}
.cell svg {
  width: 100%;
  height: 100%;
}
.cell.hit {
  animation: hit 0.28s var(--ease);
}
@keyframes hit {
  45% {
    transform: scale(0.92);
  }
}
.cell.aligned::after,
.cell.differ::after,
.cell.gift::after,
.cell.teach::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}
.cell.aligned::after {
  box-shadow: inset 0 0 0 3px rgb(168 132 62 / 0.9);
}
.cell.differ::after {
  box-shadow: inset 0 0 0 3px rgb(154 83 64 / 0.95);
}
.cell.gift::after {
  box-shadow: inset 0 0 0 3px var(--gold);
  animation: fade 1.6s ease-out forwards;
}
.cell.teach::after {
  animation: teach 1.4s ease-in-out infinite;
}
@keyframes teach {
  50% {
    box-shadow: inset 0 0 0 4px rgb(168 132 62 / 0.85);
  }
}
@keyframes fade {
  to {
    opacity: 0;
  }
}
.pad {
  display: grid;
  grid-template-columns: repeat(2, 36px);
  gap: 8px;
  justify-content: center;
  align-content: center;
}
.pad[data-n="2"] {
  grid-template-columns: 36px;
}
.face {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: var(--shadow-quiet);
  transition: transform 0.15s var(--ease), box-shadow 0.2s;
}
.face svg {
  width: 100%;
  height: 100%;
}
.face[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
}
.tray {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  border-radius: 22px;
  background: var(--paper-deep);
  box-shadow: inset 0 0 0 1px rgb(36 48 44 / 0.05);
}
.marks {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px;
  margin: -3px;
}
.marks::-webkit-scrollbar {
  display: none;
}
.dot-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  transition: transform 0.15s var(--ease), background 0.2s;
}
.dot-btn[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
}
.dot-btn svg.glyph {
  width: 22px;
  height: 22px;
  fill: currentColor;
}
.swatches {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  justify-items: center;
}
.swatch {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgb(36 48 44 / 0.12);
  transition: transform 0.15s var(--ease), box-shadow 0.2s;
}
.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--paper-deep), 0 0 0 4px var(--ink);
}
.zen-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.palettes {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px;
  margin: -4px;
}
.palettes::-webkit-scrollbar {
  display: none;
}
.pal {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  box-shadow: 0 0 0 1px rgb(36 48 44 / 0.15);
  transition: transform 0.15s var(--ease);
}
.pal i {
  display: block;
}
.pal[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--paper-deep), 0 0 0 4px var(--ink);
}
.seg {
  flex: none;
  display: flex;
  padding: 3px;
  border-radius: 999px;
  background: var(--paper);
}
.seg button {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  font-size: 14px;
  color: var(--muted);
}
.seg button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
}
.memo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.memo .thumb {
  width: 56px;
  flex: none;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-quiet);
}
.result {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.result svg {
  width: 26px;
  height: 26px;
  fill: var(--line);
}
.result svg.on {
  fill: var(--gold);
  animation: pop 0.5s var(--ease) both;
}
.result svg:nth-child(2).on {
  animation-delay: 0.12s;
}
.result svg:nth-child(3).on {
  animation-delay: 0.24s;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.3) rotate(-50deg);
  }
}
.footer {
  position: sticky;
  bottom: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 0 max(6px, env(safe-area-inset-bottom, 0px));
  margin-bottom: -10px;
  background: linear-gradient(rgb(243 238 230 / 0), var(--paper) 14px);
}
.footer:empty {
  display: none;
}
.footer .row {
  display: flex;
  gap: 8px;
}
.footer .row .pill {
  flex: 1;
}

/* ---------- win bloom: the window opens, the pattern stays put */
.bloom {
  position: fixed;
  inset: 0;
  z-index: 30;
  cursor: pointer;
  will-change: clip-path;
}
.bloom > svg {
  position: absolute;
  inset: 0;
}
.bloom.open {
  transition: clip-path 1s cubic-bezier(0.65, 0, 0.35, 1), -webkit-clip-path 1s cubic-bezier(0.65, 0, 0.35, 1);
}
.bloom.closing {
  pointer-events: none;
  opacity: 0;
  transition: clip-path 0.85s cubic-bezier(0.65, 0, 0.35, 1), -webkit-clip-path 0.85s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.5s ease 0.35s;
}
.bloom-chip {
  position: absolute;
  left: 50%;
  top: 50%;
  min-width: 200px;
  padding: 18px 28px 20px;
  border-radius: 24px;
  background: var(--paper);
  box-shadow: 0 24px 60px -24px rgb(36 48 44 / 0.55), 0 0 0 1px rgb(36 48 44 / 0.06);
  text-align: center;
  opacity: 0;
  transform: translate(-50%, -46%);
  transition: opacity 0.45s ease, transform 0.6s var(--ease);
}
.bloom.show .bloom-chip {
  opacity: 1;
  transform: translate(-50%, -50%);
}
.bloom.closing .bloom-chip {
  opacity: 0;
  transition: opacity 0.2s ease;
}
.bloom-chip .bloom-name {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  line-height: 1.15;
}
.bloom-chip .small {
  margin: 2px 0 0;
}
.bloom-chip .result {
  margin-top: 12px;
}
.bloom-chip .result svg.on {
  animation: none;
}
.bloom.show .bloom-chip .result svg.on {
  animation: pop 0.5s var(--ease) 0.15s both;
}
.bloom.show .bloom-chip .result svg:nth-child(2).on {
  animation-delay: 0.27s;
}
.bloom.show .bloom-chip .result svg:nth-child(3).on {
  animation-delay: 0.39s;
}

/* ---------- levels and gallery */
.section {
  margin-top: 28px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.meta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--muted);
}
.meta svg {
  width: 13px;
  height: 13px;
  fill: var(--gold);
}
.chapter-name {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 26px;
}
.chapter.locked .chapter-name,
.chapter.locked .lv {
  opacity: 0.45;
}
.lv-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
@media (min-width: 560px) {
  .lv-grid {
    grid-template-columns: repeat(6, 1fr);
  }
}
.lv {
  position: relative;
  aspect-ratio: 1;
  border-radius: 14px;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  padding: 4px;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--muted);
  transition: transform 0.15s var(--ease);
}
.lv:active {
  transform: scale(0.96);
}
.lv .inner {
  position: absolute;
  inset: 4px;
  border-radius: 10px;
  overflow: hidden;
}
.lv .inner svg {
  width: 100%;
  height: 100%;
}
.lv .st {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  display: flex;
  gap: 1px;
  padding: 2px 5px;
  border-radius: 999px;
  background: var(--paper);
  box-shadow: var(--shadow-quiet);
}
.lv .st svg {
  width: 9px;
  height: 9px;
  fill: var(--line);
}
.lv .st svg.on {
  fill: var(--gold);
}
.lv.next {
  color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink);
}
.lv:disabled {
  pointer-events: none;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (min-width: 640px) {
  .cards {
    grid-template-columns: repeat(3, 1fr);
  }
}
.card {
  text-align: left;
  transition: transform 0.15s var(--ease);
}
.card:active {
  transform: scale(0.98);
}
.card .frame {
  box-shadow: var(--shadow-quiet);
}
.card p {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
}
.detail {
  width: 100%;
  max-width: 36rem;
  margin: 0 auto;
}

/* ---------- sheet and toast */
.veil {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgb(36 48 44 / 0.28);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: veil 0.25s ease both;
}
@keyframes veil {
  from {
    opacity: 0;
  }
}
.sheet {
  width: min(36rem, 100%);
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -20px 50px -20px rgb(36 48 44 / 0.35);
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: up 0.4s var(--ease) both;
}
@keyframes up {
  from {
    transform: translateY(100%);
  }
}
.sheet .title {
  font-size: 32px;
  margin-bottom: 8px;
}
.set {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 52px;
}
.set + .set {
  border-top: 1px solid var(--line);
}
.toggle {
  position: relative;
  flex: none;
  width: 50px;
  height: 30px;
  border-radius: 999px;
  background: var(--line);
  transition: background 0.2s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: 0 1px 2px rgb(36 48 44 / 0.25);
  transition: transform 0.25s var(--ease);
}
.toggle[aria-checked="true"] {
  background: var(--ink);
}
.toggle[aria-checked="true"]::after {
  transform: translateX(20px);
}
input[type="range"] {
  flex: 1;
  max-width: 190px;
  accent-color: var(--ink);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
  animation: toast 1.8s var(--ease) both;
}
@keyframes toast {
  0% {
    opacity: 0;
    transform: translate(-50%, 10px);
  }
  15%,
  80% {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  100% {
    opacity: 0;
  }
}
.splash {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--paper);
  transition: opacity 0.5s ease;
}
.sr {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>

<div id="splash" class="splash" aria-hidden="true"></div>
<main id="app"></main>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(() => {
'use strict';
/* Serein audio: generative Andalusian guitar, warm pad, tuned effects. */
const Sound = (() => {
  let ctx = null;
  let master, musicBus, sfxBus, reverb;
  let timer = 0;
  let nextBar = 0;
  let barCount = 0;
  let section = [];
  let energy = 0.55;
  let melodyIdx = 3;
  const chordLog = [];
  let cfg = { music: true, vol: 0.7, sfx: true };

  const BPM = 58;
  const EIGHTH = 60 / BPM / 2;
  const BAR = EIGHTH * 8;

  const CH = {
    Am: { root: 45, tones: [57, 60, 64, 69], pad: [57, 60, 64] },
    G: { root: 43, tones: [55, 59, 62, 67], pad: [55, 59, 62] },
    F: { root: 41, tones: [53, 57, 60, 65], pad: [53, 57, 60] },
    E: { root: 40, tones: [56, 59, 64, 68], pad: [56, 59, 64] },
    Dm: { root: 38, tones: [57, 62, 65, 69], pad: [53, 57, 62] },
    C: { root: 36, tones: [55, 60, 64, 67], pad: [55, 60, 64] },
  };
  const SECTIONS = [
    ["Am", "G", "F", "E"],
    ["Am", "G", "F", "E"],
    ["Dm", "Am", "F", "E"],
    ["F", "G", "Am", "Am"],
    ["F", "C", "Dm", "E"],
    ["Am", "Dm", "E", "Am"],
  ];
  const MELODY = [64, 65, 68, 69, 71, 72, 74, 76, 77, 80, 81];
  const ARPS = [
    [0, 1, 2, 1, 3, 2, 1, 2],
    [0, 2, 1, 3, 2, 1, 2, 1],
    [0, 1, 2, 3, 2, 1, 2, 3],
    [0, -1, 1, 2, -1, 3, 2, -1],
    [0, 2, 3, 2, 1, 2, 3, 2],
  ];

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rand = (a, b) => a + Math.random() * (b - a);

  function impulse(seconds) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp += 0.35 * (Math.random() * 2 - 1 - lp);
        d[i] = lp * Math.pow(1 - t, 2.6) * (i < sr * 0.012 ? i / (sr * 0.012) : 1);
      }
    }
    return buf;
  }

  const ksCache = new Map();
  function pluckBuffer(midi, bright) {
    const key = midi + ":" + bright;
    if (ksCache.has(key)) return ksCache.get(key);
    const sr = ctx.sampleRate;
    const f = mtof(midi);
    const n = Math.max(2, Math.round(sr / f));
    const dur = Math.min(4.2, 1.4 + 160 / f);
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const ring = new Float32Array(n);
    let prev = 0;
    let mean = 0;
    for (let i = 0; i < n; i++) {
      prev += bright * (Math.random() * 2 - 1 - prev);
      ring[i] = prev;
      mean += prev;
    }
    mean /= n;
    for (let i = 0; i < n; i++) ring[i] -= mean;
    const damp = midi < 50 ? 0.9992 : 0.9982;
    let idx = 0;
    let peak = 0.0001;
    for (let i = 0; i < len; i++) {
      const a = ring[idx];
      const b = ring[(idx + 1) % n];
      d[i] = a;
      ring[idx] = (a + b) * 0.5 * damp;
      idx = (idx + 1) % n;
      if (Math.abs(a) > peak) peak = Math.abs(a);
    }
    const fade = Math.floor(sr * 0.08);
    for (let i = 0; i < len; i++) {
      d[i] = (d[i] / peak) * 0.9;
      if (i > len - fade) d[i] *= (len - i) / fade;
    }
    ksCache.set(key, buf);
    return buf;
  }

  function pluck(midi, when, gain, bus, opts = {}) {
    if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = pluckBuffer(midi, opts.bright ?? 0.5);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = opts.cutoff ?? 2600;
    lp.Q.value = 0.4;
    const g = ctx.createGain();
    g.gain.value = gain;
    let out = g;
    if (ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = opts.pan ?? rand(-0.35, 0.35);
      g.connect(p);
      out = p;
    }
    src.connect(lp);
    lp.connect(g);
    out.connect(bus);
    src.start(when);
    src.onended = () => {
      src.disconnect();
      lp.disconnect();
      g.disconnect();
      if (out !== g) out.disconnect();
    };
  }

  function bell(midi, when, gain, bus) {
    const f = mtof(midi);
    [
      [1, 1, 2.6],
      [2.76, 0.32, 1.4],
      [5.4, 0.12, 0.8],
    ].forEach(([ratio, amp, dec]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = f * ratio;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gain * amp, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
      o.connect(g);
      g.connect(bus);
      o.start(when);
      o.stop(when + dec + 0.05);
      o.onended = () => {
        o.disconnect();
        g.disconnect();
      };
    });
  }

  function pad(notes, when, dur) {
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(520, when);
    lp.frequency.linearRampToValueAtTime(820, when + dur * 0.5);
    lp.frequency.linearRampToValueAtTime(560, when + dur + 3);
    lp.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.05, when + 2.2);
    g.gain.setValueAtTime(0.05, when + dur);
    g.gain.linearRampToValueAtTime(0.0001, when + dur + 3.2);
    lp.connect(g);
    g.connect(musicBus);
    const oscs = [];
    notes.forEach((m) => {
      [-5, 5].forEach((cents) => {
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = mtof(m - 12);
        o.detune.value = cents;
        const og = ctx.createGain();
        og.gain.value = 0.16;
        o.connect(og);
        og.connect(lp);
        o.start(when);
        o.stop(when + dur + 3.4);
        oscs.push([o, og]);
      });
    });
    oscs[0][0].onended = () => {
      oscs.forEach(([o, og]) => {
        o.disconnect();
        og.disconnect();
      });
      lp.disconnect();
      g.disconnect();
    };
  }

  function chordAt(time) {
    for (let i = chordLog.length - 1; i >= 0; i--) if (chordLog[i][0] <= time) return chordLog[i][1];
    return CH.Am;
  }

  function scheduleBar(t) {
    if (section.length === 0) {
      let next = SECTIONS[Math.floor(Math.random() * SECTIONS.length)];
      if (barCount < 4) next = SECTIONS[0];
      section = next.slice();
      energy = Math.max(0.25, Math.min(0.9, energy + rand(-0.2, 0.2)));
    }
    const name = section.shift();
    const chord = CH[name];
    chordLog.push([t, chord]);
    if (chordLog.length > 16) chordLog.shift();
    barCount += 1;
    if (!cfg.music) return;

    pad(chord.pad, t, BAR);
    pluck(chord.root, t, 0.5, musicBus, { bright: 0.25, cutoff: 900, pan: 0 });
    if (Math.random() < 0.35) pluck(chord.root + 7, t + EIGHTH * 4, 0.28, musicBus, { bright: 0.25, cutoff: 900, pan: 0 });

    const arp = ARPS[Math.floor(Math.random() * ARPS.length)];
    const rolled = Math.random() < 0.3;
    if (rolled) {
      chord.tones.forEach((m, i) => pluck(m, t + i * 0.045, 0.22, musicBus, { bright: 0.45, pan: -0.2 + i * 0.13 }));
    }
    for (let s = rolled ? 2 : 0; s < 8; s++) {
      const step = arp[s];
      if (step < 0) continue;
      if (s > 0 && Math.random() > 0.35 + energy * 0.6) continue;
      const swing = s % 2 ? EIGHTH * 0.06 : 0;
      pluck(chord.tones[step], t + s * EIGHTH + swing, 0.2 + Math.random() * 0.12, musicBus, { bright: 0.42 });
    }

    if (Math.random() < 0.45 + energy * 0.3) {
      const count = 1 + Math.floor(Math.random() * 3);
      let pos = Math.floor(Math.random() * 3);
      for (let k = 0; k < count && pos < 8; k++) {
        melodyIdx = Math.max(0, Math.min(MELODY.length - 1, melodyIdx + Math.floor(rand(-2, 3))));
        let note = MELODY[melodyIdx];
        if (note === 80 && name !== "E") note = 79;
        if (note === 68 && name !== "E") note = 67;
        if (k === 0 && Math.random() < 0.5) note = chord.tones[1 + Math.floor(Math.random() * 3)] + 12;
        pluck(note, t + pos * EIGHTH, 0.26, musicBus, { bright: 0.6, cutoff: 3200 });
        pos += 2 + Math.floor(Math.random() * 3);
      }
    }
  }

  function tick() {
    if (!ctx || ctx.state !== "running") return;
    const now = ctx.currentTime;
    if (nextBar < now) nextBar = now + 0.1;
    while (nextBar < now + 1.2) {
      scheduleBar(nextBar);
      nextBar += BAR;
    }
  }


  function ramp(param, value) {
    param.cancelScheduledValues(ctx.currentTime);
    param.setValueAtTime(param.value, ctx.currentTime);
    param.linearRampToValueAtTime(value, ctx.currentTime + 0.6);
  }

  function apply() {
    if (!ctx) return;
    ramp(musicBus.gain, cfg.music ? 0.9 * cfg.vol : 0);
    ramp(sfxBus.gain, cfg.sfx ? 0.9 : 0);
  }

  function init() {
    if (ctx) {
      if (ctx.state === "suspended" && document.visibilityState === "visible") ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
    } catch (e) {}
    ctx = new AC({ latencyHint: "interactive" });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 3;
    comp.attack.value = 0.01;
    comp.release.value = 0.3;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(comp);
    reverb = ctx.createConvolver();
    reverb.buffer = impulse(3.6);
    const wet = ctx.createGain();
    wet.gain.value = 0.5;
    reverb.connect(wet);
    wet.connect(master);
    const bus = (send) => {
      const g = ctx.createGain();
      g.gain.value = 0;
      g.connect(master);
      const s = ctx.createGain();
      s.gain.value = send;
      g.connect(s);
      s.connect(reverb);
      return g;
    };
    musicBus = bus(0.65);
    sfxBus = bus(0.4);
    apply();
    nextBar = ctx.currentTime + 0.15;
    timer = window.setInterval(tick, 180);
    document.addEventListener("visibilitychange", () => {
      if (!ctx) return;
      if (document.visibilityState === "hidden") ctx.suspend().catch(() => {});
      else ctx.resume().catch(() => {});
    });
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
  }

  function ready() {
    return ctx && ctx.state === "running" && cfg.sfx;
  }

  function chordNow() {
    return chordAt(ctx ? ctx.currentTime : 0);
  }

  return {
    init,
    configure(next) {
      cfg = { ...cfg, ...next };
      apply();
      if (ctx && cfg.music && nextBar < ctx.currentTime) nextBar = ctx.currentTime + 0.1;
    },
    tap(index = 0) {
      if (!ready()) return;
      const c = chordNow();
      const note = c.tones[index % c.tones.length] + 12;
      pluck(note, ctx.currentTime + 0.005, 0.32, sfxBus, { bright: 0.55, cutoff: 3000 });
    },
    turn() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[3] + 12, ctx.currentTime + 0.005, 0.22, sfxBus, { bright: 0.7, cutoff: 3600 });
    },
    erase() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[0], ctx.currentTime + 0.005, 0.28, sfxBus, { bright: 0.3, cutoff: 1100 });
    },
    ui() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[2] + 24, ctx.currentTime + 0.005, 0.1, sfxBus, { bright: 0.5, cutoff: 3000, pan: 0 });
    },
    hint() {
      if (!ready()) return;
      bell(81, ctx.currentTime + 0.01, 0.07, sfxBus);
    },
    win() {
      if (!ready()) return;
      const t = ctx.currentTime + 0.02;
      [57, 60, 64, 69, 72, 76, 81].forEach((m, i) => pluck(m, t + i * 0.085, 0.3, sfxBus, { bright: 0.6, cutoff: 3400, pan: -0.4 + i * 0.13 }));
      bell(81, t + 0.62, 0.08, sfxBus);
      bell(88, t + 0.7, 0.05, sfxBus);
    },
    fail() {
      if (!ready()) return;
      const t = ctx.currentTime + 0.02;
      pluck(64, t, 0.28, sfxBus, { bright: 0.35, cutoff: 1400 });
      pluck(59, t + 0.22, 0.26, sfxBus, { bright: 0.35, cutoff: 1200 });
      pluck(56, t + 0.44, 0.24, sfxBus, { bright: 0.35, cutoff: 1000 });
    },
  };
})();

/* Serein core: tile motifs, glazes, pattern logic, level generation. */
const TAU = Math.PI * 2;
const f2 = (n) => String(Math.round(n * 100) / 100);
const poly = (pts) => "M" + pts.map((p) => f2(p[0]) + " " + f2(p[1])).join("L") + "Z";
const circ = (cx, cy, r) =>
  `M${f2(cx - r)} ${f2(cy)}a${f2(r)} ${f2(r)} 0 1 0 ${f2(2 * r)} 0a${f2(r)} ${f2(r)} 0 1 0 ${f2(-2 * r)} 0Z`;
const OCT = Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8);

function starPts(cx, cy, R, r, from, to, rot = 0) {
  const pts = [];
  for (let k = Math.round(from / 22.5); k <= Math.round(to / 22.5); k++) {
    const rr = k % 2 ? r : R;
    const t = ((k * 22.5 + rot) * Math.PI) / 180;
    pts.push([cx + rr * Math.cos(t), cy + rr * Math.sin(t)]);
  }
  return pts;
}
function regPts(cx, cy, r, n, rotDeg) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const t = ((rotDeg + (k * 360) / n) * Math.PI) / 180;
    pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
  }
  return pts;
}

const OCT_R = 50 / Math.cos(Math.PI / 8);
function quatrefoil(a, r) {
  const h = Math.sqrt(r * r - (a * a) / 2);
  const o = a / 2 + h / Math.SQRT2;
  const P = [[50 + o, 50 - o], [50 + o, 50 + o], [50 - o, 50 + o], [50 - o, 50 - o]];
  let d = `M${f2(P[0][0])} ${f2(P[0][1])}`;
  for (let k = 1; k <= 4; k++) d += `A${r} ${r} 0 0 1 ${f2(P[k % 4][0])} ${f2(P[k % 4][1])}`;
  return d + "Z";
}

/* Each motif lives in a 100 x 100 tile. Holes use the even-odd rule. */
const MOTIF_LIST = [
  { id: "plain", name: "Glaze", d: "M0 0H100V100H0Z" },
  { id: "half", name: "Half", d: "M0 0H100L0 100Z" },
  { id: "fan", name: "Fan", d: "M0 0H100A100 100 0 0 1 0 100Z" },
  { id: "bead", name: "Bead", d: circ(50, 50, 29) + circ(50, 50, 11) },
  {
    id: "starq",
    name: "Star corner",
    d: poly([[0, 0], ...starPts(0, 0, 72, 72 * OCT, 0, 90)]) + "M22 0A22 22 0 0 1 0 22L0 0Z",
  },
  { id: "bands", name: "Bands", d: "M0 27H100V41H0ZM0 59H100V73H0Z" },
  {
    id: "khatam",
    name: "Khatam",
    d: poly(starPts(50, 50, 47, 47 * OCT, 0, 337.5)) + poly(regPts(50, 50, 14, 8, 22.5)),
  },
  { id: "petal", name: "Petal", d: "M0 0A100 100 0 0 1 100 100A100 100 0 0 1 0 0Z" },
  {
    id: "arch",
    name: "Arch",
    d: "M18 100V60.2A35 35 0 1 1 82 60.2V100Z" + poly(starPts(50, 58, 13, 13 * OCT, 0, 337.5)),
  },
  {
    id: "lozenge",
    name: "Lozenge",
    d:
      poly([[50, 5], [95, 50], [50, 95], [5, 50]]) +
      poly([[50, 27], [73, 50], [50, 73], [27, 50]]) +
      circ(50, 50, 8),

      const bits = new Uint8Array(G * G);
      for (let j = 0; j < G; j++) {
        for (let i = 0; i < G; i++) {

          let y = ((j + 0.61) * 100) / G - 50;

      for (let q = 0; q < masks.length && found < 0; q++) {

        const o = masks[q];
        for (let k = 0; k < bits.length; k++) if (o[k] !== bits[k]) diff++;

      if (found < 0) {

      masks.push(bits);

    const centroid = (bits) => {

      .map((pose, cls) => ({ pose, cls, c: centroid(masks[pose]) }))
      .sort((a, b) => band(a.c[1]) - band(b.c[1]) || a.c[0] - b.c[0] || a.c[1] - b.c[1]);

/* Pattern grammar.

  halfstar: "edge", arch: "edge", chevron: "edge", bands: "edge",

  inner: { starq: 4, fan: 3, ring: 3, petal: 3, half: 2, slash: 1 },
  corner: { starq: 4, fan: 3, ring: 3, petal: 3, half: 2, slash: 2, plain: 1 },
  edge: { halfstar: 4, plain: 2, bands: 1, lattice: 1 },
};

  bead: ["edge", "center"], lozenge: ["edge", "center"], cross: ["center", "edge"], khatam: ["center", "edge"],
  octagon: ["center", "corner"], quatrefoil: ["center", "edge"], lattice: ["edge", "center"], plain: ["edge", "center"],
  arch: ["edge"], chevron: ["edge"], bands: ["edge"],

let LEVELS = [];

    const t = k / (PER - 1);
    const rng = mulberry32(hashString("serein-tile-" + idx));
    const pal = CHAPTERS[ch].id;
    if (idx < HANDMADE.length) {
      const h = HANDMADE[idx];
      const stamp = buildStamp(h.N, h.sym, h.paints);
      seen.add(canonicalKey(stamp, h.N));
      LEVELS.push({ idx, ch, N: h.N, target: stamp, pal, tray: h.tray, sym: false });
      continue;

    const g = generate(rng, ch, t, seen);

function dailySpec(date) {

  const g = generate(rng, ch, 0.55 + rng() * 0.35, null);
  const pal = pick(rng, PALETTE_IDS);
  const used = [...new Set(g.stamp.filter((c) => c.m).map((c) => c.m))];
  return { mode: "daily", key, ch, N: g.N, target: g.stamp, pal, tray: makeTray(rng, used, unlockedUpTo(ch), 2), sym: true };

function tideSpec(round) {

  const g = generate(rng, ch, Math.min(1, 0.1 + (round % 3) * 0.3), null);
  const pal = pick(rng, PALETTE_IDS);
  const used = [...new Set(g.stamp.filter((c) => c.m).map((c) => c.m))];
  const seconds = g.N === 4 ? Math.max(55, 110 - round * 4) : Math.max(32, 75 - round * 4);

        Number.isInteger(c.p) && c.p >= 0 && c.p <= 7,
    )
  );
}
function validDesign(d) {
  return d && [2, 3, 4].includes(d.N) && PALETTES[d.pal] && validCells(d.cells, d.N) && typeof d.id === "string";
}
function loadSave() {
  const d = defaults();
  try {
    const raw = store.get(SAVE_KEY);
    if (!raw) return d;
    const p = JSON.parse(raw);
    const stars = {};
    if (p.stars && typeof p.stars === "object") {
      for (const [k, v] of Object.entries(p.stars)) {
        const i = Number(k);
        if (Number.isInteger(i) && i >= 0 && i < TOTAL && [1, 2, 3].includes(v)) stars[i] = v;
      }
    }
    return {
      ...d,
      stars,
      daily: { ...d.daily, ...(p.daily && typeof p.daily === "object" ? p.daily : {}) },
      tideBest: Number.isInteger(p.tideBest) ? p.tideBest : 0,
      designs: Array.isArray(p.designs) ? p.designs.filter(validDesign).slice(0, 80) : [],
      draft: validDesign(p.draft) ? p.draft : null,
      settings: { ...d.settings, ...(p.settings && typeof p.settings === "object" ? p.settings : {}) },
      tips: p.tips && typeof p.tips === "object" ? p.tips : {},
    };

}

/* ---------- svg */
let uid = 0;
function poseWrap(inner, p) {
  const rot = (p % 4) * 90;
  const body = p >= 4 ? `<g transform="matrix(-1 0 0 1 100 0)">${inner}</g>` : inner;
  return rot ? `<g transform="rotate(${rot} 50 50)">${body}</g>` : body;
}
function motifMarkup(cell, pal) {
  if (!cell.m) return "";
  const fill = pal.colors[cell.c] || pal.colors[0];
  return poseWrap(`<path d="${MOTIF[cell.m].d}" fill="${fill}" fill-rule="evenodd"/>`, cell.p);
}
function tileMarkup(cell, pal) {
  return `<rect width="100" height="100" fill="${pal.ground}"/>${motifMarkup(cell, pal)}`;
}
function glyph(m, p = 0) {
  return `<svg class="glyph" viewBox="-6 -6 112 112" aria-hidden="true">${poseWrap(`<path d="${MOTIF[m].d}" fill-rule="evenodd"/>`, p)}</svg>`;
}
function clothSVG(stamp, N, palId, repeats = 2, o = {}) {
  const pal = PALETTES[palId];
  const id = "p" + ++uid;
  const size = N * 100;
  const total = size * repeats;
  let body = `<rect width="${size}" height="${size}" fill="${o.ground || pal.ground}"/>`;
  stamp.forEach((cell, i) => {
    if (!cell.m) return;
    body += `<g transform="translate(${(i % N) * 100} ${Math.floor(i / N) * 100})">${motifMarkup(cell, pal)}</g>`;
  });
  const dims = o.px ? ` width="${o.px}" height="${o.px}"` : "";
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}"${dims} aria-hidden="true" shape-rendering="geometricPrecision"><defs><pattern id="${id}" patternUnits="userSpaceOnUse" width="${size}" height="${size}">${body}</pattern></defs><rect width="${total}" height="${total}" fill="url(#${id})"/></svg>`;
}
function bandSVG(stamp, N, palId, cols, rows) {
  const pal = PALETTES[palId];
  const id = "b" + ++uid;
  const size = N * 100;
  let body = `<rect width="${size}" height="${size}" fill="${pal.ground}"/>`;
  stamp.forEach((cell, i) => {
    if (!cell.m) return;
    body += `<g transform="translate(${(i % N) * 100} ${Math.floor(i / N) * 100})">${motifMarkup(cell, pal)}</g>`;
  });
  const w = cols * 100;
  const h = rows * 100;
  return `<svg viewBox="0 0 ${f2(w)} ${h}" aria-hidden="true" preserveAspectRatio="xMinYMin slice" style="width:100%;height:100%"><defs><pattern id="${id}" patternUnits="userSpaceOnUse" width="${size}" height="${size}">${body}</pattern></defs><rect width="${f2(w)}" height="${h}" fill="url(#${id})"/></svg>`;
}
function bloomSVG(stamp, N, palId, cell, ox, oy, w, h) {
  const pal = PALETTES[palId];
  const id = "bl" + ++uid;
  const size = N * 100;
  let body = `<rect width="${size}" height="${size}" fill="${pal.ground}"/>`;
  stamp.forEach((c, i) => {
    if (!c.m) return;
    body += `<g transform="translate(${(i % N) * 100} ${Math.floor(i / N) * 100})">${motifMarkup(c, pal)}</g>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" shape-rendering="geometricPrecision"><defs><pattern id="${id}" patternUnits="userSpaceOnUse" width="${size}" height="${size}" patternTransform="translate(${f2(ox)} ${f2(oy)}) scale(${(cell / 100).toFixed(5)})">${body}</pattern></defs><rect width="${w}" height="${h}" fill="url(#${id})"/></svg>`;
}
function tileSVG(cell, palId) {
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${tileMarkup(cell, PALETTES[palId])}</svg>`;
}

/* ---------- play */
function newSession(spec) {
  const firstColor = spec.target ? (spec.target.find((c) => c.m) || { c: 0 }).c : 0;
  const lead = spec.tray.find((m) => m !== "plain") || spec.tray[0];
  P = {
    ...spec,
    symOK: !!spec.sym,
    stamp: spec.stamp ? cloneStamp(spec.stamp) : emptyStamp(spec.N),
    past: [],
    brush: { m: spec.mode === "level" && spec.idx < 2 ? "plain" : lead, c: firstColor, poses: {} },
    erasing: false,
    sym: "none",
    hints: 0,
    phase: "play",
    bestHits: 0,
    lastProgress: performance.now(),
  };
}
function startLevel(i) {
  const L = LEVELS[i];
  newSession({ mode: "level", idx: i, ch: L.ch, N: L.N, target: L.target, pal: L.pal, tray: L.tray, sym: L.sym });
  go("play");
}
function startDaily() {
  newSession(dailySpec(new Date()));
  go("play");
}
function startTide(round = 0, woven = 0) {

  go("play");
}
function startZen(from) {
  const src = from || save.draft || SHOWCASE();
  newSession({ mode: "zen", N: src.N, pal: src.pal, tray: ORDER.slice(), stamp: src.cells, target: null, sym: true });

  P.brush.c = 1;
  go("play");
}

function renderStitch(changed = [], gift = -1) {

      if (mark) cls.push(visualKey(cell) === visualKey(P.target[srcIndex(i, P.N, sh)]) ? "aligned" : "differ");

function renderProgress() {

function afterChange(changed, gift = -1) {
  renderStitch(changed, gift);
  renderBoards();
  renderProgress();
  renderTools();
  if (P.mode === "zen") {
    save.draft = { id: "draft", N: P.N, pal: P.pal, cells: cloneStamp(P.stamp) };
    clearTimeout(afterChange._t);
    afterChange._t = setTimeout(persist, 400);
  } else checkWin();

function pushPast() {
  P.past.push(cloneStamp(P.stamp));
  if (P.past.length > 80) P.past.shift();
}

function bindStitch() {
  const el = document.getElementById("stitch");
  el.addEventListener("pointerdown", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell || P.phase !== "play") return;
    e.preventDefault();
    stroke = { painted: new Set(), pushed: false };
    try {
      el.setPointerCapture(e.pointerId);
    } catch (err) {}
    paintAt(Number(cell.dataset.i), true);
  });
  el.addEventListener("pointermove", (e) => {
    if (!stroke || P.phase !== "play") return;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const cell = hit && hit.closest ? hit.closest(".cell") : null;
    if (cell && el.contains(cell)) {
      const i = Number(cell.dataset.i);
      if (!stroke.painted.has(i)) paintAt(i, false);
    }
  });
  const end = () => {
    stroke = null;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
function paintAt(i, first) {
  const cur = P.stamp[i];
  const b = brushCell();
  stroke.painted.add(i);
  if (first && !P.erasing && P.sym === "none" && cur.m === b.m && visualKey(cur) === visualKey(b) && LOOK[b.m].facings.length > 1) {
    const f = LOOK[b.m].facings;
    const np = f[LOOK[b.m].look[ROT_POSE[cur.p]]];
    pushPast();
    stroke.pushed = true;
    P.stamp[i] = { ...cur, p: np };
    P.brush.poses[b.m] = np;
    Sound.turn();
    haptic(6);
    afterChange([i]);
    return;
  }
  const next = paintStamp(P.stamp, P.N, i, b, P.sym);
  const changed = [];
  next.forEach((c, k) => {
    if (visualKey(c) !== visualKey(P.stamp[k])) changed.push(k);
  });
  if (!changed.length) return;
  if (!stroke.pushed) {
    pushPast();
    stroke.pushed = true;
  }
  P.stamp = next;
  if (P.erasing) Sound.erase();
  else Sound.tap(i);
  haptic(5);
  afterChange(changed);
}
/* The finished repeat opens out from the "Yours" window until the pattern fills the screen,
   rests, then folds into the next cloth's window. The pattern never scales, only the window grows. */
let bloomTimer = 0;
let folding = false;
function insetOf(r, radius) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  return `inset(${f2(Math.max(0, r.top))}px ${f2(Math.max(0, vw - r.right))}px ${f2(Math.max(0, vh - r.bottom))}px ${f2(Math.max(0, r.left))}px round ${radius}px)`;
}
function setClip(el, value) {
  el.style.webkitClipPath = value;
  el.style.clipPath = value;
}
function celebrate(chip, next) {
  const from = document.getElementById("mine") || document.getElementById("stitch");
  if (!from) return next();
  const r = from.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const cell = r.width / (from.id === "mine" ? 2 * P.N : P.N);
  document.querySelectorAll(".bloom").forEach((n) => n.remove());
  const ov = document.createElement("div");
  ov.className = "bloom";
  ov.setAttribute("role", "status");
  ov.innerHTML = bloomSVG(P.stamp, P.N, P.pal, cell, r.left, r.top, vw, vh) + `<div class="bloom-chip">${chip}</div>`;
  setClip(ov, insetOf(r, 11));
  document.body.appendChild(ov);
  ov.getBoundingClientRect();
  requestAnimationFrame(() => {
    ov.classList.add("open");
    setClip(ov, "inset(0px 0px 0px 0px round 0px)");
  });
  let done = false;
  const fold = () => {
    if (done) return;
    done = true;
    clearTimeout(bloomTimer);
    folding = true;
    try {
      next();
    } finally {
      folding = false;
    }
    const target = document.getElementById("cloth") || document.querySelector(".today .inner");
    const t = target ? target.getBoundingClientRect() : { top: vh / 2, bottom: vh / 2, left: vw / 2, right: vw / 2 };
    ov.classList.add("closing");
    requestAnimationFrame(() => setClip(ov, insetOf(t, 11)));
    setTimeout(() => ov.remove(), 900);
  };
  bloomTimer = setTimeout(() => {
    ov.classList.add("show");
    bloomTimer = setTimeout(fold, 1900);
  }, 1050);
  ov.addEventListener("click", () => {
    if (ov.classList.contains("show")) fold();
  });
}
function checkWin() {
  if (!P.target || P.phase !== "play") return;
  if (P.hits !== P.N * P.N) return;
  P.phase = "clear";
  stopLoops();
  Sound.win();
  haptic([12, 50, 24]);
  announce("The stitch holds");
  setNote("The stitch holds.");
  if (P.mode === "level") {
    const s = 3 - Math.min(2, P.hints);
    save.stars[P.idx] = Math.max(save.stars[P.idx] || 0, s);
    P.earned = s;
    persist();
  } else if (P.mode === "daily") {
    if (!save.daily.done[P.key]) {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      save.daily.streak = save.daily.last === dateKey(y) ? save.daily.streak + 1 : 1;
      save.daily.last = P.key;
      save.daily.done[P.key] = 1;
      const keys = Object.keys(save.daily.done).sort();
      while (keys.length > 60) delete save.daily.done[keys.shift()];
      persist();
    }
    const r = document.getElementById("right");
    if (r) r.textContent = save.daily.streak === 1 ? "Woven today" : `${save.daily.streak} days running`;
  } else if (P.mode === "tide") {
    P.woven += 1;
    if (P.woven > save.tideBest) {
      save.tideBest = P.woven;
      persist();
    }
    const bar = document.getElementById("bar");
    if (bar) bar.classList.add("held");
  }
  renderStitch();
  renderProgress();
  renderTools();
  const stars = (n) => `<div class="result">${[1, 2, 3].map((x) => starSvg(x <= n)).join("")}</div>`;
  let chip;
  let next;
  if (P.mode === "level") {
    const idx = P.idx;
    const last = idx % PER === PER - 1;
    chip = `<p class="bloom-name">${chapterName(P.ch)}</p><p class="small num">${last ? "Chapter woven" : `Cloth ${idx + 1}`}</p>${stars(P.earned)}`;
    next = () => (idx + 1 < TOTAL ? startLevel(idx + 1) : go("levels"));
  } else if (P.mode === "daily") {
    chip = `<p class="bloom-name">Today’s cloth</p><p class="small num">${save.daily.streak > 1 ? `${save.daily.streak} days running` : "Woven today"}</p>`;
    next = () => go("room");
  } else {
    const round = P.round;
    const woven = P.woven;
    chip = `<p class="bloom-name">${woven} in a row</p>`;
    next = () => startTide(round + 1, woven);
  }
  const tools = document.getElementById("tools");
  if (tools) tools.hidden = true;
  const bench = document.getElementById("bench");
  if (bench) bench.classList.add("done");
  clearTimeout(bloomTimer);
  bloomTimer = setTimeout(() => {

}
function tideLoop() {
  const bar = document.getElementById("bar");
  const fill = bar && bar.querySelector("i");
  const right = document.getElementById("right");
  const total = P.seconds * 1000;
  let shown = -1;
  const step = () => {
    if (!P || P.mode !== "tide" || P.phase !== "play") return;
    const remain = P.endsAt - performance.now();
    if (fill) fill.style.transform = `scaleX(${Math.max(0, remain / total)})`;
    const urgent = remain < 10000;
    if (bar) bar.classList.toggle("urgent", urgent);
    const secs = Math.max(0, Math.ceil(remain / 1000));
    if (secs !== shown && right) {
      shown = secs;
      right.textContent = clock(secs);
      right.classList.toggle("urgent", urgent);
    }
    if (remain <= 0) {
      if (P.hits === P.N * P.N) return checkWin();
      P.phase = "over";
      Sound.fail();
      haptic(40);
      setNote(`Time. ${P.hits} of ${P.N * P.N} lined up.`);
      if (right) right.textContent = "Out of time";
      const memo = document.getElementById("memo");
      if (memo) {
        memo.hidden = false;
        memo.innerHTML = `<div class="thumb">${clothSVG(P.target, P.N, P.pal, 1)}</div><span class="small">The stitch it wanted</span>`;
      }
      renderStitch();
      renderTools();
      renderFooter();
      return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function useHint() {
  if (!P || P.phase !== "play" || !P.target) return;
  const N = P.N;
  const sh = bestShift(P.stamp, P.target, N);
  const wrong = [];
  for (let i = 0; i < N * N; i++) {
    const want = P.target[srcIndex(i, N, sh)];
    if (visualKey(P.stamp[i]) !== visualKey(want)) wrong.push([i, want]);
  }
  if (!wrong.length) return;
  wrong.sort((a, b) => (b[1].m ? 1 : 0) - (a[1].m ? 1 : 0));
  const [i, want] = wrong[0];
  pushPast();
  P.stamp[i] = { ...want };
  P.hints += 1;
  Sound.hint();
  haptic(8);
  document.getElementById("hintBtn")?.classList.remove("glow");
  if (want.m && P.tray.includes(want.m)) {
    P.brush.m = want.m;
    P.brush.c = want.c;
    P.brush.poses[want.m] = want.p;
    P.erasing = false;
  }
  afterChange([i], i);
}

/* ---------- export */
function exportImage(payload) {
  const px = 1600;
  const reps = payload.N === 2 ? 6 : payload.N === 3 ? 4 : 3;
  const svg = clothSVG(payload.cells, payload.N, payload.pal, reps, { px });
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = cv.height = px;
    cv.getContext("2d").drawImage(img, 0, 0, px, px);
    URL.revokeObjectURL(url);
    cv.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], payload.name + ".png", { type: "image/png" });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, "image/png");
  };
  img.src = url;
}
