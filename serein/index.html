<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serein</title>
<meta name="description" content="Study the repeat. Rebuild its stitch. A quiet tile pattern game.">
<meta name="theme-color" content="#f3eee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serein">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Serein: a quiet pattern room. Paper ground, ink type, framed cloth beside the stitch, tools below. */
:root {
  --paper: #f3eee6;
  --paper-deep: #e7e0d4;
  --ink: #24302c;
  --muted: #5c675f;
  --line: #d5cdc0;
  --clay: #9a5340;
  --gold: #a8843e;
  --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --shadow-cloth: 0 0 0 1px rgb(36 48 44 / 0.06), 0 18px 40px -24px rgb(36 48 44 / 0.28);
  --shadow-quiet: 0 0 0 1px rgb(36 48 44 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  color-scheme: light;
}
html {
  box-sizing: border-box;
  height: 100%;
  background: var(--paper);
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:disabled {
  cursor: default;
}
:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
}
svg {
  display: block;
}
h1,
h2 {
  text-wrap: balance;
}
p {
  text-wrap: pretty;
}

#app {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#app::-webkit-scrollbar {
  display: none;
}
.page {
  max-width: 64rem;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
  display: flex;
  flex-direction: column;
}
.rise {
  animation: rise 0.55s var(--ease) both;
}
.rise-late {
  animation-delay: 90ms;
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

/* ---------- header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
}
.top .group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.eyebrow {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 4px;
  border-radius: 999px;
  font-size: 15px;
  transition: transform 0.15s var(--ease);
}
.link:active,
.round:active,
.pill:active,
.dot-btn:active,
.swatch:active,
.face-btn:active {
  transform: scale(0.96);
}
.link svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.round {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  transition: transform 0.15s var(--ease);
}
.round svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.round.glow {
  animation: glow 1.6s ease-in-out infinite;
}
@keyframes glow {
  50% {
    box-shadow: 0 0 0 6px rgb(168 132 62 / 0.35);
  }
}

/* ---------- type */
.title {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 40px;
  line-height: 1.05;
  color: var(--ink);
}
.hero {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(60px, 17vw, 84px);
  line-height: 0.95;
}
.lede {
  margin: 14px 0 0;
  max-width: 24rem;
  font-size: 18px;
  line-height: 1.55;
  color: var(--muted);
}
.small {
  font-size: 14px;
  color: var(--muted);
}
.num {
  font-variant-numeric: tabular-nums;
}

/* ---------- buttons */
.pill {
  min-height: 44px;
  padding: 0 20px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  color: var(--ink);
  font-size: 15px;
  transition: transform 0.15s var(--ease), background 0.2s;
}
.pill.ink {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
  font-weight: 500;
}
.pill.ink:hover {
  background: var(--clay);
}
.pill.wide {
  width: 100%;
}
.pill.plain {
  background: none;
  box-shadow: none;
}
.pill.warn {
  background: var(--clay);
  color: var(--paper);
  box-shadow: none;
}
.pill[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
}
.pill svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- room */
.room {
  flex: 1;
  display: grid;
  align-items: center;
  gap: 32px;
  padding: 20px 0 8px;
}
@media (min-width: 900px) {
  .room {
    grid-template-columns: 1fr 1fr;
    gap: 56px;
  }
}
.room .actions {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  max-width: 340px;
}
.frame {
  border-radius: 18px;
  background: var(--paper-deep);
  padding: 8px;
  box-shadow: var(--shadow-cloth);
}
.frame.tight {
  padding: 6px;
  border-radius: 16px;
}
.frame .inner {
  border-radius: 10px;
  overflow: hidden;
}
.frame svg {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
}
.caption {
  margin: 12px 0 0;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}
.today {
  display: block;
  width: 100%;
  max-width: 30rem;
  justify-self: center;
  text-align: left;
}

/* ---------- play */
.play-wrap {
  width: 100%;
  max-width: 36rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.status {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.status .right {
  font-size: 14px;
}
.status .right.urgent {
  color: var(--clay);
}
.bar {
  height: 4px;
  border-radius: 4px;
  background: var(--line);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--ink);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.4s var(--ease), background 0.3s;
}
.bar.tide i {
  transition: none;
}
.bar.urgent i {
  background: var(--clay);
}
.bar.held i {
  background: var(--gold);
}
.note {
  margin: 0;
  min-height: 22px;
  font-size: 15px;
  color: var(--muted);
}
.boards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-items: start;
}
.boards.n4 {
  grid-template-columns: 1fr 1.18fr;
}
.label-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
  min-height: 18px;
}
.label-row .eyebrow {
  font-size: 11px;
}
.label-row .small {
  font-size: 12px;
}
.stitch {
  display: grid;
  gap: 4px;
  padding: 6px;
  border-radius: 16px;
  background: var(--line);
  touch-action: none;
  transition: box-shadow 0.4s;
}
.stitch.whole {
  box-shadow: 0 0 0 2px var(--gold);
}
.cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.15s var(--ease);
}
.cell svg {
  width: 100%;
  height: 100%;
}
.cell.hit {
  animation: hit 0.28s var(--ease);
}
@keyframes hit {
  45% {
    transform: scale(0.92);
  }
}
.cell.aligned::after,
.cell.differ::after,
.cell.gift::after,
.cell.teach::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}
.cell.aligned::after {
  box-shadow: inset 0 0 0 3px rgb(168 132 62 / 0.9);
}
.cell.differ::after {
  box-shadow: inset 0 0 0 3px rgb(154 83 64 / 0.95);
}
.cell.gift::after {
  box-shadow: inset 0 0 0 3px var(--gold);
  animation: fade 1.6s ease-out forwards;
}
.cell.teach::after {
  animation: teach 1.4s ease-in-out infinite;
}
@keyframes teach {
  50% {
    box-shadow: inset 0 0 0 4px rgb(168 132 62 / 0.85);
  }
}
@keyframes fade {
  to {
    opacity: 0;
  }
}
.tools {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
}
.tools.off {
  pointer-events: none;
  opacity: 0.4;
}
.marks {
  display: flex;
  align-items: center;
  gap: 6px;
}
.marks .scroller {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
  margin: -2px;
}
.marks .scroller::-webkit-scrollbar {
  display: none;
}
.dot-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  color: var(--ink);
  transition: transform 0.15s var(--ease), background 0.2s;
}
.dot-btn[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
}
.dot-btn:disabled {
  opacity: 0.4;
}
.dot-btn svg.glyph {
  width: 22px;
  height: 22px;
  fill: currentColor;
}
.dot-btn svg.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.swatches {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  justify-items: center;
}
.swatch {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  box-shadow: var(--shadow-quiet);
  transition: transform 0.15s var(--ease);
}
.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
}
.facing {
  display: grid;
  gap: 8px;
}
.facing.f2 {
  grid-template-columns: repeat(2, 1fr);
}
.facing.f4 {
  grid-template-columns: repeat(4, 1fr);
}
.face-btn {
  min-height: 44px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  color: var(--ink);
  transition: transform 0.15s var(--ease);
}
.face-btn[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
  box-shadow: none;
}
.face-btn svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}
.syms {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.syms .pill {
  padding: 0 4px;
  font-size: 14px;
}
.palettes {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
  margin: -2px;
}
.palettes::-webkit-scrollbar {
  display: none;
}
.palettes .pill {
  flex: none;
  padding: 0 16px;
  font-size: 14px;
}
.result {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.result svg {
  width: 26px;
  height: 26px;
  fill: var(--line);
}
.result svg.on {
  fill: var(--gold);
  animation: pop 0.5s var(--ease) both;
}
.result svg:nth-child(2).on {
  animation-delay: 0.12s;
}
.result svg:nth-child(3).on {
  animation-delay: 0.24s;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.3) rotate(-50deg);
  }
}
.memo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.memo .thumb {
  width: 56px;
  flex: none;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-quiet);
}
.footer {
  position: sticky;
  bottom: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 0 max(8px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgb(243 238 230 / 0), var(--paper) 14px);
}
.footer:empty {
  display: none;
}
[hidden] {
  display: none !important;
}
.footer .row {
  display: flex;
  gap: 8px;
}
.footer .row .pill {
  flex: 1;
}

/* ---------- levels and gallery */
.section {
  margin-top: 28px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.section-head .meta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--muted);
}
.section-head .meta svg {
  width: 13px;
  height: 13px;
  fill: var(--gold);
}
.chapter-name {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
}
.chapter.locked .chapter-name,
.chapter.locked .lv {
  opacity: 0.45;
}
.lv-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
@media (min-width: 560px) {
  .lv-grid {
    grid-template-columns: repeat(6, 1fr);
  }
}
.lv {
  position: relative;
  aspect-ratio: 1;
  border-radius: 14px;
  background: var(--paper-deep);
  box-shadow: var(--shadow-quiet);
  padding: 4px;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--muted);
  transition: transform 0.15s var(--ease);
}
.lv:active {
  transform: scale(0.96);
}
.lv .inner {
  position: absolute;
  inset: 4px;
  border-radius: 10px;
  overflow: hidden;
}
.lv .inner svg {
  width: 100%;
  height: 100%;
}
.lv .st {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  display: flex;
  gap: 1px;
  padding: 2px 5px;
  border-radius: 999px;
  background: var(--paper);
  box-shadow: var(--shadow-quiet);
}
.lv .st svg {
  width: 9px;
  height: 9px;
  fill: var(--line);
}
.lv .st svg.on {
  fill: var(--gold);
}
.lv.next {
  color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink);
}
.lv:disabled {
  pointer-events: none;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (min-width: 640px) {
  .cards {
    grid-template-columns: repeat(3, 1fr);
  }
}
.card {
  text-align: left;
  transition: transform 0.15s var(--ease);
}
.card:active {
  transform: scale(0.98);
}
.card .frame {
  box-shadow: var(--shadow-quiet);
}
.card p {
  margin: 8px 0 0;
  font-size: 14px;
}
.detail {
  width: 100%;
  max-width: 36rem;
  margin: 0 auto;
}

/* ---------- sheet and toast */
.veil {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgb(36 48 44 / 0.28);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: veil 0.25s ease both;
}
@keyframes veil {
  from {
    opacity: 0;
  }
}
.sheet {
  width: min(36rem, 100%);
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -20px 50px -20px rgb(36 48 44 / 0.35);
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: up 0.4s var(--ease) both;
}
@keyframes up {
  from {
    transform: translateY(100%);
  }
}
.sheet .title {
  font-size: 30px;
  margin-bottom: 8px;
}
.set {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 52px;
}
.set + .set {
  border-top: 1px solid var(--line);
}
.toggle {
  position: relative;
  flex: none;
  width: 50px;
  height: 30px;
  border-radius: 999px;
  background: var(--line);
  transition: background 0.2s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: 0 1px 2px rgb(36 48 44 / 0.25);
  transition: transform 0.25s var(--ease);
}
.toggle[aria-checked="true"] {
  background: var(--ink);
}
.toggle[aria-checked="true"]::after {
  transform: translateX(20px);
}
input[type="range"] {
  flex: 1;
  max-width: 190px;
  accent-color: var(--ink);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  pointer-events: none;
  animation: toast 1.8s var(--ease) both;
}
@keyframes toast {
  0% {
    opacity: 0;
    transform: translate(-50%, 10px);
  }
  15%,
  80% {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  100% {
    opacity: 0;
  }
}
.splash {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--paper);
  transition: opacity 0.5s ease;
}
.sr {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>

<div id="splash" class="splash" aria-hidden="true"></div>
<main id="app"></main>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(() => {
'use strict';
/* Serein audio: generative Andalusian guitar, warm pad, courtyard fountain, tuned effects. */
const Sound = (() => {
  let ctx = null;
  let master, musicBus, sfxBus, ambBus, reverb;
  let ambNodes = null;
  let timer = 0;
  let nextBar = 0;
  let barCount = 0;
  let section = [];
  let energy = 0.55;
  let melodyIdx = 3;
  const chordLog = [];
  let cfg = { music: true, vol: 0.7, fountain: true, sfx: true };

  const BPM = 58;
  const EIGHTH = 60 / BPM / 2;
  const BAR = EIGHTH * 8;

  const CH = {
    Am: { root: 45, tones: [57, 60, 64, 69], pad: [57, 60, 64] },
    G: { root: 43, tones: [55, 59, 62, 67], pad: [55, 59, 62] },
    F: { root: 41, tones: [53, 57, 60, 65], pad: [53, 57, 60] },
    E: { root: 40, tones: [56, 59, 64, 68], pad: [56, 59, 64] },
    Dm: { root: 38, tones: [57, 62, 65, 69], pad: [53, 57, 62] },
    C: { root: 36, tones: [55, 60, 64, 67], pad: [55, 60, 64] },
  };
  const SECTIONS = [
    ["Am", "G", "F", "E"],
    ["Am", "G", "F", "E"],
    ["Dm", "Am", "F", "E"],
    ["F", "G", "Am", "Am"],
    ["F", "C", "Dm", "E"],
    ["Am", "Dm", "E", "Am"],
  ];
  const MELODY = [64, 65, 68, 69, 71, 72, 74, 76, 77, 80, 81];
  const ARPS = [
    [0, 1, 2, 1, 3, 2, 1, 2],
    [0, 2, 1, 3, 2, 1, 2, 1],
    [0, 1, 2, 3, 2, 1, 2, 3],
    [0, -1, 1, 2, -1, 3, 2, -1],
    [0, 2, 3, 2, 1, 2, 3, 2],
  ];

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rand = (a, b) => a + Math.random() * (b - a);

  function impulse(seconds) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp += 0.35 * (Math.random() * 2 - 1 - lp);
        d[i] = lp * Math.pow(1 - t, 2.6) * (i < sr * 0.012 ? i / (sr * 0.012) : 1);
      }
    }
    return buf;
  }

  const ksCache = new Map();
  function pluckBuffer(midi, bright) {
    const key = midi + ":" + bright;
    if (ksCache.has(key)) return ksCache.get(key);
    const sr = ctx.sampleRate;
    const f = mtof(midi);
    const n = Math.max(2, Math.round(sr / f));
    const dur = Math.min(4.2, 1.4 + 160 / f);
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const ring = new Float32Array(n);
    let prev = 0;
    let mean = 0;
    for (let i = 0; i < n; i++) {
      prev += bright * (Math.random() * 2 - 1 - prev);
      ring[i] = prev;
      mean += prev;
    }
    mean /= n;
    for (let i = 0; i < n; i++) ring[i] -= mean;
    const damp = midi < 50 ? 0.9992 : 0.9982;
    let idx = 0;
    let peak = 0.0001;
    for (let i = 0; i < len; i++) {
      const a = ring[idx];
      const b = ring[(idx + 1) % n];
      d[i] = a;
      ring[idx] = (a + b) * 0.5 * damp;
      idx = (idx + 1) % n;
      if (Math.abs(a) > peak) peak = Math.abs(a);
    }
    const fade = Math.floor(sr * 0.08);
    for (let i = 0; i < len; i++) {
      d[i] = (d[i] / peak) * 0.9;
      if (i > len - fade) d[i] *= (len - i) / fade;
    }
    ksCache.set(key, buf);
    return buf;
  }

  function pluck(midi, when, gain, bus, opts = {}) {
    if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = pluckBuffer(midi, opts.bright ?? 0.5);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = opts.cutoff ?? 2600;
    lp.Q.value = 0.4;
    const g = ctx.createGain();
    g.gain.value = gain;
    let out = g;
    if (ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = opts.pan ?? rand(-0.35, 0.35);
      g.connect(p);
      out = p;
    }
    src.connect(lp);
    lp.connect(g);
    out.connect(bus);
    src.start(when);
    src.onended = () => {
      src.disconnect();
      lp.disconnect();
      g.disconnect();
      if (out !== g) out.disconnect();
    };
  }

  function bell(midi, when, gain, bus) {
    const f = mtof(midi);
    [
      [1, 1, 2.6],
      [2.76, 0.32, 1.4],
      [5.4, 0.12, 0.8],
    ].forEach(([ratio, amp, dec]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = f * ratio;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gain * amp, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
      o.connect(g);
      g.connect(bus);
      o.start(when);
      o.stop(when + dec + 0.05);
      o.onended = () => {
        o.disconnect();
        g.disconnect();
      };
    });
  }

  function pad(notes, when, dur) {
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(520, when);
    lp.frequency.linearRampToValueAtTime(820, when + dur * 0.5);
    lp.frequency.linearRampToValueAtTime(560, when + dur + 3);
    lp.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.05, when + 2.2);
    g.gain.setValueAtTime(0.05, when + dur);
    g.gain.linearRampToValueAtTime(0.0001, when + dur + 3.2);
    lp.connect(g);
    g.connect(musicBus);
    const oscs = [];
    notes.forEach((m) => {
      [-5, 5].forEach((cents) => {
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = mtof(m - 12);
        o.detune.value = cents;
        const og = ctx.createGain();
        og.gain.value = 0.16;
        o.connect(og);
        og.connect(lp);
        o.start(when);
        o.stop(when + dur + 3.4);
        oscs.push([o, og]);
      });
    });
    oscs[0][0].onended = () => {
      oscs.forEach(([o, og]) => {
        o.disconnect();
        og.disconnect();
      });
      lp.disconnect();
      g.disconnect();
    };
  }

  function chordAt(time) {
    for (let i = chordLog.length - 1; i >= 0; i--) if (chordLog[i][0] <= time) return chordLog[i][1];
    return CH.Am;
  }

  function scheduleBar(t) {
    if (section.length === 0) {
      let next = SECTIONS[Math.floor(Math.random() * SECTIONS.length)];
      if (barCount < 4) next = SECTIONS[0];
      section = next.slice();
      energy = Math.max(0.25, Math.min(0.9, energy + rand(-0.2, 0.2)));
    }
    const name = section.shift();
    const chord = CH[name];
    chordLog.push([t, chord]);
    if (chordLog.length > 16) chordLog.shift();
    barCount += 1;
    if (!cfg.music) return;

    pad(chord.pad, t, BAR);
    pluck(chord.root, t, 0.5, musicBus, { bright: 0.25, cutoff: 900, pan: 0 });
    if (Math.random() < 0.35) pluck(chord.root + 7, t + EIGHTH * 4, 0.28, musicBus, { bright: 0.25, cutoff: 900, pan: 0 });

    const arp = ARPS[Math.floor(Math.random() * ARPS.length)];
    const rolled = Math.random() < 0.3;
    if (rolled) {
      chord.tones.forEach((m, i) => pluck(m, t + i * 0.045, 0.22, musicBus, { bright: 0.45, pan: -0.2 + i * 0.13 }));
    }
    for (let s = rolled ? 2 : 0; s < 8; s++) {
      const step = arp[s];
      if (step < 0) continue;
      if (s > 0 && Math.random() > 0.35 + energy * 0.6) continue;
      const swing = s % 2 ? EIGHTH * 0.06 : 0;
      pluck(chord.tones[step], t + s * EIGHTH + swing, 0.2 + Math.random() * 0.12, musicBus, { bright: 0.42 });
    }

    if (Math.random() < 0.45 + energy * 0.3) {
      const count = 1 + Math.floor(Math.random() * 3);
      let pos = Math.floor(Math.random() * 3);
      for (let k = 0; k < count && pos < 8; k++) {
        melodyIdx = Math.max(0, Math.min(MELODY.length - 1, melodyIdx + Math.floor(rand(-2, 3))));
        let note = MELODY[melodyIdx];
        if (note === 80 && name !== "E") note = 79;
        if (note === 68 && name !== "E") note = 67;
        if (k === 0 && Math.random() < 0.5) note = chord.tones[1 + Math.floor(Math.random() * 3)] + 12;
        pluck(note, t + pos * EIGHTH, 0.26, musicBus, { bright: 0.6, cutoff: 3200 });
        pos += 2 + Math.floor(Math.random() * 3);
      }
    }
  }

  function tick() {
    if (!ctx || ctx.state !== "running") return;
    const now = ctx.currentTime;
    if (nextBar < now) nextBar = now + 0.1;
    while (nextBar < now + 1.2) {
      scheduleBar(nextBar);
      nextBar += BAR;
    }
    if (cfg.fountain && ambNodes && Math.random() < 0.3) {
      const when = now + Math.random() * 0.3;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      const f = rand(1300, 2900);
      o.type = "sine";
      o.frequency.setValueAtTime(f, when);
      o.frequency.exponentialRampToValueAtTime(f * rand(1.25, 1.6), when + 0.05);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(rand(0.006, 0.016), when + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.07);
      o.connect(g);
      g.connect(ambBus);
      o.start(when);
      o.stop(when + 0.09);
      o.onended = () => {
        o.disconnect();
        g.disconnect();
      };
    }
  }

  function buildFountain() {
    const sr = ctx.sampleRate;
    const len = sr * 4;
    const buf = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.95 * b2 + w * 0.048;
        d[i] = (b0 + b1 + b2 + w * 0.05) * 0.9;
      }
      const x = Math.floor(sr * 0.2);
      for (let i = 0; i < x; i++) {
        const k = i / x;
        d[i] = d[i] * k + d[len - x + i] * (1 - k);
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = 0.2;
    src.loopEnd = 4;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 380;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500;
    bp.Q.value = 0.35;
    const g = ctx.createGain();
    g.gain.value = 0.11;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.09;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);
    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    g.connect(ambBus);
    src.start();
    lfo.start();
    ambNodes = { src, lfo };
  }

  function ramp(param, value) {
    param.cancelScheduledValues(ctx.currentTime);
    param.setValueAtTime(param.value, ctx.currentTime);
    param.linearRampToValueAtTime(value, ctx.currentTime + 0.6);
  }

  function apply() {
    if (!ctx) return;
    ramp(musicBus.gain, cfg.music ? 0.9 * cfg.vol : 0);
    ramp(ambBus.gain, cfg.fountain ? 0.9 * cfg.vol + 0.15 : 0);
    ramp(sfxBus.gain, cfg.sfx ? 0.9 : 0);
  }

  function init() {
    if (ctx) {
      if (ctx.state === "suspended" && document.visibilityState === "visible") ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
    } catch (e) {}
    ctx = new AC({ latencyHint: "interactive" });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 3;
    comp.attack.value = 0.01;
    comp.release.value = 0.3;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(comp);
    reverb = ctx.createConvolver();
    reverb.buffer = impulse(3.6);
    const wet = ctx.createGain();
    wet.gain.value = 0.5;
    reverb.connect(wet);
    wet.connect(master);
    const bus = (send) => {
      const g = ctx.createGain();
      g.gain.value = 0;
      g.connect(master);
      const s = ctx.createGain();
      s.gain.value = send;
      g.connect(s);
      s.connect(reverb);
      return g;
    };
    musicBus = bus(0.65);
    sfxBus = bus(0.4);
    ambBus = bus(0.25);
    buildFountain();
    apply();
    nextBar = ctx.currentTime + 0.15;
    timer = window.setInterval(tick, 180);
    document.addEventListener("visibilitychange", () => {
      if (!ctx) return;
      if (document.visibilityState === "hidden") ctx.suspend().catch(() => {});
      else ctx.resume().catch(() => {});
    });
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
  }

  function ready() {
    return ctx && ctx.state === "running" && cfg.sfx;
  }

  function chordNow() {
    return chordAt(ctx ? ctx.currentTime : 0);
  }

  return {
    init,
    configure(next) {
      cfg = { ...cfg, ...next };
      apply();
      if (ctx && cfg.music && nextBar < ctx.currentTime) nextBar = ctx.currentTime + 0.1;
    },
    tap(index = 0) {
      if (!ready()) return;
      const c = chordNow();
      const note = c.tones[index % c.tones.length] + 12;
      pluck(note, ctx.currentTime + 0.005, 0.32, sfxBus, { bright: 0.55, cutoff: 3000 });
    },
    turn() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[3] + 12, ctx.currentTime + 0.005, 0.22, sfxBus, { bright: 0.7, cutoff: 3600 });
    },
    erase() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[0], ctx.currentTime + 0.005, 0.28, sfxBus, { bright: 0.3, cutoff: 1100 });
    },
    ui() {
      if (!ready()) return;
      const c = chordNow();
      pluck(c.tones[2] + 24, ctx.currentTime + 0.005, 0.1, sfxBus, { bright: 0.5, cutoff: 3000, pan: 0 });
    },
    hint() {
      if (!ready()) return;
      bell(81, ctx.currentTime + 0.01, 0.07, sfxBus);
    },
    win() {
      if (!ready()) return;
      const t = ctx.currentTime + 0.02;
      [57, 60, 64, 69, 72, 76, 81].forEach((m, i) => pluck(m, t + i * 0.085, 0.3, sfxBus, { bright: 0.6, cutoff: 3400, pan: -0.4 + i * 0.13 }));
      bell(81, t + 0.62, 0.08, sfxBus);
      bell(88, t + 0.7, 0.05, sfxBus);
    },
    fail() {
      if (!ready()) return;
      const t = ctx.currentTime + 0.02;
      pluck(64, t, 0.28, sfxBus, { bright: 0.35, cutoff: 1400 });
      pluck(59, t + 0.22, 0.26, sfxBus, { bright: 0.35, cutoff: 1200 });
      pluck(56, t + 0.44, 0.24, sfxBus, { bright: 0.35, cutoff: 1000 });
    },
  };
})();

/* Serein core: tile motifs, glazes, pattern logic, level generation. */
const TAU = Math.PI * 2;
const f2 = (n) => String(Math.round(n * 100) / 100);
const poly = (pts) => "M" + pts.map((p) => f2(p[0]) + " " + f2(p[1])).join("L") + "Z";
const circ = (cx, cy, r) =>
  `M${f2(cx - r)} ${f2(cy)}a${f2(r)} ${f2(r)} 0 1 0 ${f2(2 * r)} 0a${f2(r)} ${f2(r)} 0 1 0 ${f2(-2 * r)} 0Z`;
const OCT = Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8);

function starPts(cx, cy, R, r, from, to, rot = 0) {
  const pts = [];
  for (let k = Math.round(from / 22.5); k <= Math.round(to / 22.5); k++) {
    const rr = k % 2 ? r : R;
    const t = ((k * 22.5 + rot) * Math.PI) / 180;
    pts.push([cx + rr * Math.cos(t), cy + rr * Math.sin(t)]);
  }
  return pts;
}
function regPts(cx, cy, r, n, rotDeg) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const t = ((rotDeg + (k * 360) / n) * Math.PI) / 180;
    pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
  }
  return pts;
}

const OCT_R = 50 / Math.cos(Math.PI / 8);
function quatrefoil(a, r) {
  const h = Math.sqrt(r * r - (a * a) / 2);
  const o = a / 2 + h / Math.SQRT2;
  const P = [[50 + o, 50 - o], [50 + o, 50 + o], [50 - o, 50 + o], [50 - o, 50 - o]];
  let d = `M${f2(P[0][0])} ${f2(P[0][1])}`;
  for (let k = 1; k <= 4; k++) d += `A${r} ${r} 0 0 1 ${f2(P[k % 4][0])} ${f2(P[k % 4][1])}`;
  return d + "Z";
}

const PALETTES = {
  sevilla: { name: "Sevilla", ground: "#f3ead6", grout: "#d6c8ac", colors: ["#1f4f9e", "#e2a72c", "#c4622d", "#2f7a58", "#3b2b35"] },
  granada: { name: "Granada", ground: "#efe2c9", grout: "#d3c19f", colors: ["#245e50", "#b2452f", "#dcae4b", "#25406a", "#211b1d"] },
  fez: { name: "Fez", ground: "#f1eee5", grout: "#d1cbbb", colors: ["#0f6d6a", "#1d3f8e", "#3e8b49", "#e5b03b", "#232323"] },
  chefchaouen: { name: "Chefchaouen", ground: "#eef3f7", grout: "#cad6e0", colors: ["#2c6db3", "#86b6df", "#1b3b6b", "#d7a243", "#53657b"] },

const CHAPTERS = [

/* ---------- random */

}

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

const pick = (rng, list) => list[Math.floor(rng() * list.length)];
function shuffle(list, rng) {

    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;

/* ---------- poses: 0..3 turns clockwise, 4..7 mirrored then turned */
function applyPose(pose, x, y) {

  let py = y;

    py = px;
    px = nx;
  }
  return [px, py];
}

  const want = probes.map(([x, y]) => fn(x, y));
  for (let pose = 0; pose < 8; pose++) {
    if (probes.every(([x, y], i) => {
      const g = applyPose(pose, x, y);
      return Math.abs(g[0] - want[i][0]) < 1e-6 && Math.abs(g[1] - want[i][1]) < 1e-6;
    })) return pose;
  }
  return 0;
}
const ROT_POSE = [];
const MIR_POSE = [];
for (let pose = 0; pose < 8; pose++) {
  ROT_POSE.push(matchPose((x, y) => { const [a, b] = applyPose(pose, x, y); return [-b, a]; }));
  MIR_POSE.push(matchPose((x, y) => { const [a, b] = applyPose(pose, x, y); return [-a, b]; }));

/* Visual looks of each motif, measured from its own geometry. */
const LOOK = {};
function computeLooks() {
  const ctx = document.createElement("canvas").getContext("2d");
  const G = 24;
  for (const m of MOTIF_LIST) {
    const path = new Path2D(m.d);
    const masks = [];
    const look = [];
    const facings = [];
    for (let pose = 0; pose < 8; pose++) {
      const bits = new Uint8Array(G * G);
      for (let j = 0; j < G; j++) {
        for (let i = 0; i < G; i++) {
          let x = ((i + 0.37) * 100) / G - 50;
          let y = ((j + 0.61) * 100) / G - 50;
          for (let t = 0; t < pose % 4; t++) {
            const nx = y;
            y = -x;
            x = nx;
          }
          if (pose >= 4) x = -x;
          bits[j * G + i] = ctx.isPointInPath(path, x + 50, y + 50, "evenodd") ? 1 : 0;
        }
      }
      let found = -1;
      for (let q = 0; q < masks.length && found < 0; q++) {
        let diff = 0;
        const o = masks[q];
        for (let k = 0; k < bits.length; k++) if (o[k] !== bits[k]) diff++;
        if (diff <= 6) found = look[q];
      }
      if (found < 0) {
        found = facings.length;
        facings.push(pose);
      }
      masks.push(bits);
      look.push(found);
    }
    /* Order facings the way they read on a page: top row left to right, then the bottom row. */
    const centroid = (bits) => {
      let sx = 0, sy = 0, n = 0;
      for (let k = 0; k < bits.length; k++) {
        if (!bits[k]) continue;
        sx += k % G;
        sy += Math.floor(k / G);
        n++;
      }
      return n ? [sx / n / G, sy / n / G] : [0.5, 0.5];
    };
    const band = (y) => (y < 0.46 ? 0 : y > 0.54 ? 2 : 1);
    const order = facings
      .map((pose, cls) => ({ pose, cls, c: centroid(masks[pose]) }))
      .sort((a, b) => band(a.c[1]) - band(b.c[1]) || a.c[0] - b.c[0] || a.c[1] - b.c[1]);
    const remap = [];
    order.forEach((o, k) => (remap[o.cls] = k));
    LOOK[m.id] = { look: look.map((c) => remap[c]), facings: order.map((o) => o.pose) };
  }
}

/* ---------- stamps */
const EMPTY = Object.freeze({ m: null, c: 0, p: 0 });
const emptyStamp = (N) => Array.from({ length: N * N }, () => ({ ...EMPTY }));

function visualKey(cell) {
  if (!cell || !cell.m) return "e";
  return cell.m + ":" + cell.c + ":" + LOOK[cell.m].look[cell.p];
}
const rotIdx = (i, N) => (i % N) * N + (N - 1 - Math.floor(i / N));
const mirIdx = (i, N) => Math.floor(i / N) * N + (N - 1 - (i % N));

function place(stamp, images, brush, lock) {
  const chosen = new Map();
  chosen.set(lock, brush.p);
  for (const im of images) {
    if (im.i === lock) continue;
    const prev = chosen.get(im.i);
    if (prev === undefined) chosen.set(im.i, im.p);
    else if (im.p >= 4 && prev < 4) chosen.set(im.i, im.p);
  }
  for (const [i, p] of chosen) stamp[i] = { m: brush.m, c: brush.c, p: brush.m ? p : 0 };
}

function paintStamp(stamp, N, index, brush, sym) {
  const next = cloneStamp(stamp);
  if (sym === "none") {
    next[index] = { ...brush };
    return next;
  }
  const images = [];
  let cur = { i: index, p: brush.p };
  if (sym === "mirror") {
    images.push(cur, { i: mirIdx(index, N), p: MIR_POSE[brush.p] });
  } else {
    for (let s = 0; s < 4; s++) {
      images.push(cur);
      if (sym === "kaleido") images.push({ i: mirIdx(cur.i, N), p: MIR_POSE[cur.p] });
      cur = { i: rotIdx(cur.i, N), p: ROT_POSE[cur.p] };
    }
  }
  place(next, images, brush, index);
  return next;
}

function bestShift(player, target, N) {
  let best = { dx: 0, dy: 0, hits: -1 };
  const pk = player.map(visualKey);
  const tk = target.map(visualKey);
  for (let dy = 0; dy < N; dy++) {
    for (let dx = 0; dx < N; dx++) {
      let hits = 0;
      for (let i = 0; i < N * N; i++) {
        const x = i % N;
        const y = Math.floor(i / N);
        if (pk[i] === tk[((y + dy) % N) * N + ((x + dx) % N)]) hits++;
      }
      if (hits > best.hits) best = { dx, dy, hits };
    }
  }
  return best;
}
const srcIndex = (i, N, sh) => ((Math.floor(i / N) + sh.dy) % N) * N + (((i % N) + sh.dx) % N);

function canonicalKey(stamp, N) {
  const keys = stamp.map(visualKey);
  let best = null;
  for (let dy = 0; dy < N; dy++) {
    for (let dx = 0; dx < N; dx++) {
      const k = keys.map((_, i) => keys[((Math.floor(i / N) + dy) % N) * N + (((i % N) + dx) % N)]).join("|");
      if (best === null || k < best) best = k;
    }
  }
  return best;
}

function unlockedUpTo(ch) {
  return CHAPTERS.slice(0, ch + 1).flatMap((c) => c.intro);
}

/* ---------- level generation */
const HANDMADE = [
  { N: 2, sym: "none", paints: [{ i: 0, m: "plain", c: 0, p: 0 }], tray: ["plain"] },
  { N: 2, sym: "none", paints: [{ i: 0, m: "plain", c: 0, p: 0 }, { i: 3, m: "plain", c: 1, p: 0 }], tray: ["plain"] },
  { N: 2, sym: "four", paints: [{ i: 0, m: "half", c: 0, p: 0 }], tray: ["plain", "half"] },
  { N: 2, sym: "four", paints: [{ i: 0, m: "fan", c: 2, p: 2 }], tray: ["plain", "half", "fan"] },
  { N: 2, sym: "none", paints: [{ i: 0, m: "bead", c: 0, p: 0 }, { i: 3, m: "plain", c: 1, p: 0 }], tray: ["plain", "fan", "bead"] },
];

function buildStamp(N, sym, paints) {
  let s = emptyStamp(N);
  for (const pt of paints) s = paintStamp(s, N, pt.i, { m: pt.m, c: pt.c, p: pt.p }, sym);
  return s;
}

/* Motifs that join across tile edges, with the side they reach toward at pose 0. */
const ANCHORED = { half: "corner", fan: "corner", starq: "corner", ring: "corner", petal: "corner", halfstar: "edge", arch: "edge", chevron: "edge" };
function anchorPose(m, i, N, rng) {
  const x = i % N;
  const y = Math.floor(i / N);
  const mid = (N - 1) / 2;
  const out = rng() < 0.7;
  const right = x === mid ? rng() < 0.5 : out ? x > mid : x < mid;
  const down = y === mid ? rng() < 0.5 : out ? y > mid : y < mid;
  if (ANCHORED[m] === "corner") return !right && !down ? 0 : right && !down ? 1 : right && down ? 2 : 3;
  const dx = Math.abs(x - mid);
  const dy = Math.abs(y - mid);
  if (dy >= dx) return down ? 2 : 0;
  return right ? 1 : 3;
}

function generate(rng, ch, t, seen) {
  const C = CHAPTERS[ch];
  const N = C.N;
  const pool = unlockedUpTo(ch);
  const fresh = C.intro;
  let symChoices;
  if (N === 2) symChoices = t < 0.5 ? ["four", "kaleido", "mirror"] : ["mirror", "none", "four"];
  else if (N === 3) symChoices = t < 0.3 ? ["kaleido", "four"] : t < 0.7 ? ["four", "mirror", "kaleido"] : ["mirror", "none", "four"];
  else symChoices = t < 0.4 ? ["kaleido", "four"] : t < 0.75 ? ["four", "mirror", "kaleido"] : ["mirror", "four", "none"];
  for (let attempt = 0; attempt < 400; attempt++) {
    const sym = pick(rng, symChoices);
    let nP = N === 2 ? 1 + Math.floor(t * 2.4) : N === 3 ? 2 + Math.floor(t * 3.2) : 3 + Math.floor(t * 4.2);
    if (sym === "none") nP += 1;
    if (sym === "kaleido" && nP > 2) nP -= 1;
    const nC = Math.min(5, (ch >= 1 ? 3 : 2) + Math.floor(t * 2.2));
    const colors = shuffle([0, 1, 2, 3, 4], rng).slice(0, nC);
    const paints = [];
    for (let k = 0; k < nP; k++) {
      const m = k === 0 ? pick(rng, fresh) : rng() < 0.4 ? pick(rng, fresh) : pick(rng, pool);
      const i = Math.floor(rng() * N * N);
      let p = Math.floor(rng() * 8);
      if (ANCHORED[m] && rng() < 0.85 - t * 0.35) p = anchorPose(m, i, N, rng);
      paints.push({ i, m, c: pick(rng, colors), p });
    }
    const stamp = buildStamp(N, sym, paints);
    const filled = stamp.filter((c) => c.m).length;
    const kinds = new Set(stamp.map(visualKey)).size;
    if (filled === 0) continue;
    if (N === 2 && ch === 0 && filled < 2) continue;
    if (N === 3 && filled < 4 + Math.floor(t * 3)) continue;
    if (N === 4 && filled < 7 + Math.floor(t * 5)) continue;
    if (N === 3 && kinds < 2 + Math.floor(t * 2)) continue;
    if (N === 4 && kinds < 3 + Math.floor(t * 3)) continue;
    const key = canonicalKey(stamp, N);
    if (seen && seen.has(key)) continue;
    if (seen) seen.add(key);
    return { N, stamp, sym };

function makeTray(rng, used, pool, extra) {
  const set = new Set(used);
  const spare = shuffle(pool.filter((m) => !set.has(m)), rng);
  for (let k = 0; k < extra && k < spare.length; k++) set.add(spare[k]);

}

let LEVELS = [];
function buildLevels() {
  const seen = new Set();
  LEVELS = [];
  for (let idx = 0; idx < TOTAL; idx++) {
    const ch = Math.floor(idx / PER);
    const k = idx % PER;
    const t = k / (PER - 1);
    const rng = mulberry32(hashString("serein-tile-" + idx));
    const pal = CHAPTERS[ch].id;
    if (idx < HANDMADE.length) {
      const h = HANDMADE[idx];
      const stamp = buildStamp(h.N, h.sym, h.paints);
      seen.add(canonicalKey(stamp, h.N));
      LEVELS.push({ idx, ch, N: h.N, target: stamp, pal, tray: h.tray, sym: false });
      continue;
    }
    const g = generate(rng, ch, t, seen);
    const used = [...new Set(g.stamp.filter((c) => c.m).map((c) => c.m))];
    const extra = ch === 0 ? 1 : Math.min(3, Math.floor(t * 2) + (ch >= 3 ? 1 : 0));
    LEVELS.push({ idx, ch, N: g.N, target: g.stamp, pal, tray: makeTray(rng, used, unlockedUpTo(ch), extra), sym: ch >= SYM_FROM });
  }
}

function dailySpec(date) {
  const key = dateKey(date);
  const rng = mulberry32(hashString("serein-daily-" + key));
  const ch = 2 + Math.floor(rng() * 5);
  const g = generate(rng, ch, 0.55 + rng() * 0.35, null);
  const pal = pick(rng, PALETTE_IDS);
  const used = [...new Set(g.stamp.filter((c) => c.m).map((c) => c.m))];
  return { mode: "daily", key, ch, N: g.N, target: g.stamp, pal, tray: makeTray(rng, used, unlockedUpTo(ch), 2), sym: true };
}

function tideSpec(round) {

  const g = generate(rng, ch, Math.min(1, 0.1 + (round % 3) * 0.3), null);
  const pal = pick(rng, PALETTE_IDS);
  const used = [...new Set(g.stamp.filter((c) => c.m).map((c) => c.m))];
  const seconds = g.N === 4 ? Math.max(55, 110 - round * 4) : Math.max(32, 75 - round * 4);
  return { mode: "tide", round, ch, N: g.N, target: g.stamp, pal, tray: makeTray(rng, used, unlockedUpTo(ch), 1), sym: true, seconds };
}

function dateKey(d) {

function defaults() {

    v: 2,
    stars: {},
    daily: { last: null, streak: 0, done: {} },
    tideBest: 0,

function validCells(cells, N) {

      (c) =>
        c &&

        Number.isInteger(c.c) && c.c >= 0 && c.c <= 4 &&

let idleTimer = 0;

function persist() {
  store.set(SAVE_KEY, JSON.stringify(save));
}
function haptic(pattern) {
  if (!save.settings.haptics || !navigator.vibrate) return;
  try {
    navigator.vibrate(pattern);
  } catch (e) {}
}
function announce(text) {
  live.textContent = text;
}
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}
function nextLevel() {
  for (let i = 0; i < TOTAL; i++) if (!save.stars[i]) return i;
  return -1;
}
const unlocked = (i) => i === 0 || !!save.stars[i - 1] || !!save.stars[i];
const chapterName = (ch) => PALETTES[CHAPTERS[ch].id].name;
const isTop = (() => {
  try {
    return window.self === window.top;
  } catch (e) {
    return false;
  }
})();
const longDate = (d) => new Intl.DateTimeFormat("en", { weekday: "long", month: "long", day: "numeric" }).format(d);
const clock = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const soundOn = () => save.settings.music || save.settings.sfx || save.settings.fountain;
const SHOWCASE = () => ({
  N: 3,
  pal: "granada",
  cells: buildStamp(3, "kaleido", [
    { i: 0, m: "starq", c: 0, p: 0 },
    { i: 4, m: "khatam", c: 1, p: 0 },
    { i: 1, m: "halfstar", c: 2, p: 2 },
  ]),
});

function closeOverlays() {
  document.querySelectorAll(".veil").forEach((n) => n.remove());
}
function stopLoops() {
  cancelAnimationFrame(raf);
  raf = 0;
  clearInterval(idleTimer);
  idleTimer = 0;
}
function go(name, arg) {
  stopLoops();
  closeOverlays();
  screen = name;
  VIEWS[name](arg);
  app.scrollTop = 0;
}
const soundBtn = () => `<button class="round" data-a="sound" id="soundBtn" aria-label="Sound">${soundOn() ? I.sound : I.mute}</button>`;
const backLink = (label, action = "room") => `<button class="link" data-a="${action}">${I.back}<span>${label}</span></button>`;

/* ---------- room */
function roomView() {
  const now = new Date();
  const daily = dailySpec(now);
  const n = nextLevel();
  const doneToday = !!save.daily.done[daily.key];
  const where = n < 0 ? "Every cloth is woven." : `${chapterName(Math.floor(n / PER))} ${n + 1}`;
  const best = save.tideBest > 0 ? ` · Best run ${save.tideBest}` : "";
  app.innerHTML = `<div class="page">
  <header class="top"><p class="eyebrow">A pattern room</p><div class="group"><button class="link" data-a="gallery">Gallery</button>${soundBtn()}</div></header>
  <div class="room">
    <div class="rise">
      <h1 class="hero">Serein</h1>
      <p class="lede">Study the repeat. Rebuild its stitch.</p>
      <p class="small" style="margin:18px 0 0">${longDate(now)}</p>
      <div class="actions">
        <button class="pill ink play" data-a="continue">${n === 0 ? "Begin" : "Play"}</button>
        <button class="pill" data-a="levels">Levels</button>
        <button class="pill" data-a="tide">Recreate</button>
        <button class="pill" data-a="zen">Zen</button>
      </div>
      <p class="small num" style="margin:18px 0 0">${where}${best}</p>
    </div>
    <button class="today rise rise-late" data-a="daily" aria-label="Today's cloth">
      <div class="frame"><div class="inner">${clothSVG(daily.target, daily.N, daily.pal, 3)}</div></div>
      <p class="caption">Today’s cloth${doneToday ? " · woven" : ""}</p>
    </button>
  </div></div>`;
}

/* ---------- levels */
function levelsView() {
  const n = nextLevel();
  let html = `<div class="page"><header class="top">${backLink("Room")}<div class="group">${soundBtn()}</div></header><h1 class="title rise">Levels</h1>`;
  CHAPTERS.forEach((C, ch) => {
    let got = 0;
    for (let k = 0; k < PER; k++) got += save.stars[ch * PER + k] || 0;
    const open = unlocked(ch * PER);
    html += `<section class="section chapter${open ? "" : " locked"}" id="ch${ch}"><div class="section-head"><h2 class="chapter-name">${chapterName(ch)}</h2><span class="meta num">${starSvg(true)}${got}/${PER * 3}</span></div><div class="lv-grid">`;
    for (let k = 0; k < PER; k++) {
      const i = ch * PER + k;
      const s = save.stars[i] || 0;
      const L = LEVELS[i];
      if (s) {
        html += `<button class="lv" data-a="level" data-i="${i}" aria-label="Level ${i + 1}, ${s} of 3"><span class="inner">${clothSVG(L.target, L.N, L.pal, 1)}</span><span class="st">${[1, 2, 3].map((x) => starSvg(x <= s)).join("")}</span></button>`;
      } else if (unlocked(i)) {
        html += `<button class="lv${i === n ? " next" : ""}" data-a="level" data-i="${i}" aria-label="Level ${i + 1}">${i + 1}</button>`;
      } else {
        html += `<button class="lv" disabled aria-label="Level ${i + 1}, locked">${i + 1}</button>`;
      }
    }
    html += `</div></section>`;
  });
  app.innerHTML = html + `</div>`;
  const ch = Math.floor(Math.max(0, n) / PER);
  const el = document.getElementById("ch" + ch);
  if (el && ch > 0) app.scrollTop = el.offsetTop - 70;
}

/* ---------- gallery */
function designName(d, k) {
  const pal = PALETTES[d.pal].name;
  const same = save.designs.filter((x, j) => j >= k && x.pal === d.pal).length;
  return same <= 1 ? `${pal} cloth` : `${pal} cloth ${same}`;
}
function galleryView() {
  const yours = save.designs;
  const collected = Object.keys(save.stars).map(Number).sort((a, b) => a - b);
  const card = (svg, name, attrs) => `<button class="card" ${attrs}><div class="frame tight"><div class="inner">${svg}</div></div><p>${name}</p></button>`;
  app.innerHTML = `<div class="page"><header class="top">${backLink("Room")}<div class="group">${soundBtn()}</div></header>
  <h1 class="title rise">Gallery</h1>
  <section class="section"><div class="section-head"><p class="eyebrow">Yours</p></div>
  ${yours.length
    ? `<div class="cards">${yours.map((d, k) => card(clothSVG(d.cells, d.N, d.pal, 2), designName(d, k), `data-a="detail" data-src="yours" data-k="${k}"`)).join("")}</div>`
    : `<div class="actions"><button class="pill" data-a="zen">Zen</button></div>`}
  </section>
  <section class="section"><div class="section-head"><p class="eyebrow">Collected</p><span class="meta num">${collected.length}/${TOTAL}</span></div>
  ${collected.length
    ? `<div class="cards">${collected.map((i) => { const L = LEVELS[i]; return card(clothSVG(L.target, L.N, L.pal, 2), `${chapterName(L.ch)} ${i + 1}`, `data-a="detail" data-src="level" data-k="${i}"`); }).join("")}</div>`
    : `<div class="actions"><button class="pill ink" data-a="continue">Play</button></div>`}
  </section></div>`;
}
function detailView() {
  const yours = D.src === "yours";
  const d = yours ? save.designs[D.k] : null;
  const L = yours ? null : LEVELS[D.k];
  if (yours && !d) return go("gallery");
  const N = yours ? d.N : L.N;
  const pal = yours ? d.pal : L.pal;
  const cells = yours ? d.cells : L.target;
  const name = yours ? designName(d, D.k) : `${chapterName(L.ch)} ${D.k + 1}`;
  D.payload = { N, pal, cells, name: "serein-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-") };
  app.innerHTML = `<div class="page"><header class="top">${backLink("Gallery", "gallery")}<div class="group">${soundBtn()}</div></header>
  <div class="detail rise">
    <h1 class="title">${name}</h1>
    <p class="small" style="margin:6px 0 20px">${PALETTES[pal].name}</p>
    <div class="frame"><div class="inner">${clothSVG(cells, N, pal, N === 2 ? 6 : N === 3 ? 4 : 3)}</div></div>
    <div class="actions" style="margin-top:20px">
      <button class="pill ink" data-a="openZen">Open in zen</button>
      ${yours ? "" : `<button class="pill" data-a="level" data-i="${D.k}">Play again</button>`}
      ${isTop ? `<button class="pill" data-a="export">Save image</button>` : ""}
      ${yours ? `<span id="removeBox"><button class="pill plain" data-a="remove" style="color:var(--muted)">Remove</button></span>` : ""}
    </div>
  </div></div>`;
}

/* ---------- play */
function newSession(spec) {
  const firstColor = spec.target ? (spec.target.find((c) => c.m) || { c: 0 }).c : 0;
  const lead = spec.tray.find((m) => m !== "plain") || spec.tray[0];
  P = {
    ...spec,
    symOK: !!spec.sym,
    stamp: spec.stamp ? cloneStamp(spec.stamp) : emptyStamp(spec.N),
    past: [],
    brush: { m: spec.mode === "level" && spec.idx < 2 ? "plain" : lead, c: firstColor, poses: {} },
    erasing: false,
    sym: "none",
    hints: 0,
    phase: "play",
    bestHits: 0,
    lastProgress: performance.now(),
  };
}
function startLevel(i) {
  const L = LEVELS[i];
  newSession({ mode: "level", idx: i, ch: L.ch, N: L.N, target: L.target, pal: L.pal, tray: L.tray, sym: L.sym });
  go("play");
}
function startDaily() {
  newSession(dailySpec(new Date()));
  go("play");
}
function startTide(round = 0, woven = 0) {
  const spec = tideSpec(round);
  newSession(spec);
  P.woven = woven;
  P.endsAt = performance.now() + spec.seconds * 1000;
  go("play");
}
function startZen(from) {
  const src = from || save.draft || SHOWCASE();
  newSession({ mode: "zen", N: src.N, pal: src.pal, tray: ORDER.slice(), stamp: src.cells, target: null, sym: true });
  P.brush.m = "khatam";
  P.brush.c = 1;
  go("play");
}

function playView() {
  const m = P.mode;
  const eyebrow =
    m === "level" ? chapterName(P.ch) : m === "daily" ? "Today’s cloth" : m === "tide" ? "Recreate" : "Zen";
  const right =
    m === "level" ? `Level ${P.idx + 1}` : m === "daily" ? new Intl.DateTimeFormat("en", { month: "short", day: "numeric" }).format(new Date()) : m === "tide" ? clock(P.seconds) : "";
  const back = m === "level" ? backLink("Levels", "levels") : m === "zen" && D ? backLink("Gallery", "gallery") : backLink("Room");
  const sizes = m === "zen"
    ? `<span class="group" role="group" aria-label="Grid size">${[2, 3, 4].map((n) => `<button class="small num" data-a="size" data-n="${n}" aria-pressed="${P.N === n}" style="min-width:26px;min-height:26px;border-radius:999px;${P.N === n ? "background:var(--ink);color:var(--paper)" : ""}">${n}</button>`).join("")}</span>`
    : `<span class="small num" id="streak"></span>`;
  app.innerHTML = `<div class="page">
  <header class="top">${back}<div class="group">${m === "level" || m === "daily" ? `<button class="round" data-a="hint" id="hintBtn" aria-label="Hint">${I.lantern}</button>` : ""}${soundBtn()}</div></header>
  <div class="play-wrap rise">
    ${m === "zen"
      ? `<h1 class="title" style="margin-bottom:4px">Zen</h1>`
      : `<div><div class="status"><p class="eyebrow">${eyebrow}</p><span class="right num" id="right">${right}</span></div><div class="bar${m === "tide" ? " tide" : ""}" id="bar" style="margin-top:8px"><i></i></div></div>`}
    <p class="note" id="note" hidden></p>
    <div class="boards${P.N === 4 ? " n4" : ""}" id="boards">
      <div><div class="label-row"><span class="eyebrow">Repeat</span></div><div class="frame tight"><div class="inner" id="cloth"></div></div></div>
      <div><div class="label-row"><span class="eyebrow">Stitch</span>${sizes}</div><div class="stitch" id="stitch" role="grid" aria-label="Your stitch"></div></div>
    </div>
    ${m !== "zen" ? `<div><div class="label-row"><span class="eyebrow">Your repeat</span></div><div class="frame tight"><div class="inner mine" id="mine"></div></div></div>` : ""}
    <div class="memo" id="memo" hidden></div>
    <div class="tools" id="tools">
      ${m === "zen" ? `<div class="palettes" role="group" aria-label="Palette">${PALETTE_IDS.map((id) => `<button class="pill" data-a="pal" data-pal="${id}" aria-pressed="${id === P.pal}">${PALETTES[id].name}</button>`).join("")}</div>` : ""}
      <div class="marks"><div class="scroller" id="marks" role="group" aria-label="Marks"></div>
        <button class="dot-btn" data-a="erase" id="eraseBtn" aria-label="Clear a cell" aria-pressed="false">${I.eraser}</button>
        <button class="dot-btn" data-a="undo" id="undoBtn" aria-label="Undo">${I.undo}</button></div>
      <div class="swatches" id="swatches" role="group" aria-label="Glaze"></div>
      <div id="facing"></div>
      ${P.symOK ? `<div class="syms" role="group" aria-label="Symmetry">${SYMS.map((s) => `<button class="pill" data-a="sym" data-sym="${s}" aria-pressed="${P.sym === s}">${SYM_NAME[s]}</button>`).join("")}</div>` : ""}
    </div>
    <div class="footer" id="footer"></div>
  </div></div>`;
  bindStitch();
  renderTools();
  renderStitch();
  renderCloth();
  renderMine();
  renderProgress();
  renderFooter();
  if (m === "tide") tideLoop();
  if (m === "level" || m === "daily") {
    idleTimer = setInterval(() => {
      const b = document.getElementById("hintBtn");
      if (b && P.phase === "play" && performance.now() - P.lastProgress > 50000) b.classList.add("glow");
    }, 5000);
  }
}

function brushCell() {
  if (P.erasing) return { ...EMPTY };
  const m = P.brush.m;
  return { m, c: P.brush.c, p: P.brush.poses[m] ?? LOOK[m].facings[0] };
}
function renderTools() {
  const marks = document.getElementById("marks");
  if (!marks) return;
  marks.innerHTML = P.tray
    .map((m) => `<button class="dot-btn" data-a="motif" data-m="${m}" aria-label="${MOTIF[m].name}" aria-pressed="${!P.erasing && P.brush.m === m}">${glyph(m)}</button>`)
    .join("");
  document.getElementById("eraseBtn").setAttribute("aria-pressed", String(P.erasing));
  document.getElementById("swatches").innerHTML = PALETTES[P.pal].colors
    .map((c, k) => `<button class="swatch" data-a="color" data-c="${k}" style="background:${c}" aria-label="Glaze ${k + 1}" aria-pressed="${!P.erasing && P.brush.c === k}"></button>`)
    .join("");
  const m = P.brush.m;
  const f = LOOK[m].facings;
  const facing = document.getElementById("facing");
  if (f.length > 1 && !P.erasing) {
    const cur = LOOK[m].look[P.brush.poses[m] ?? f[0]];
    facing.innerHTML = `<p class="eyebrow" style="margin:0 0 6px;font-size:11px">Facing</p><div class="facing ${f.length === 2 ? "f2" : "f4"}" role="group" aria-label="Facing">${f
      .map((p, k) => `<button class="face-btn" data-a="face" data-p="${p}" aria-label="Facing ${k + 1}" aria-pressed="${k === cur}">${glyph(m, p).replace('class="glyph" ', "")}</button>`)
      .join("")}</div>`;
  } else facing.innerHTML = "";
  const selected = marks.querySelector('[aria-pressed="true"]');
  if (selected && marks.scrollWidth > marks.clientWidth) {
    const l = selected.offsetLeft - marks.offsetLeft;
    if (l < marks.scrollLeft || l + 44 > marks.scrollLeft + marks.clientWidth) marks.scrollLeft = l - 50;
  }
  const undo = document.getElementById("undoBtn");
  if (undo) undo.disabled = P.past.length === 0 || P.phase !== "play";
}
function renderStitch(changed = [], gift = -1) {
  const el = document.getElementById("stitch");
  if (!el) return;
  el.style.gridTemplateColumns = `repeat(${P.N}, 1fr)`;
  el.classList.toggle("whole", P.phase === "clear");
  const teach = P.mode === "level" && P.idx === 0 && !P.stamp.some((c) => c.m);
  const mark = P.phase === "clear" || P.phase === "over";
  const sh = mark ? bestShift(P.stamp, P.target, P.N) : null;
  el.innerHTML = P.stamp
    .map((cell, i) => {
      const cls = ["cell"];
      if (changed.includes(i)) cls.push("hit");
      if (gift === i) cls.push("gift");
      if (teach && i === 0) cls.push("teach");
      if (mark) cls.push(visualKey(cell) === visualKey(P.target[srcIndex(i, P.N, sh)]) ? "aligned" : "differ");
      return `<div class="${cls.join(" ")}" data-i="${i}" role="gridcell" aria-label="${cell.m ? MOTIF[cell.m].name : "Empty"}">${tileSVG(cell, P.pal)}</div>`;
    })
    .join("");
}
function renderMine() {
  const el = document.getElementById("mine");
  const cloth = document.getElementById("cloth");
  if (!el || !cloth || !P) return;
  const cell = cloth.clientWidth / (2 * P.N);
  const width = el.clientWidth;
  if (!cell || !width) return;
  const rows = 2 * P.N;
  el.style.height = Math.round(rows * cell) + "px";
  el.innerHTML = bandSVG(P.stamp, P.N, P.pal, width / cell, rows);
}
function renderCloth() {
  const el = document.getElementById("cloth");
  if (!el) return;
  el.innerHTML = P.mode === "zen" ? clothSVG(P.stamp, P.N, P.pal, 3) : clothSVG(P.target, P.N, P.pal, 2);
}
function renderProgress() {
  if (!P.target) return;
  const hits = bestShift(P.stamp, P.target, P.N).hits;
  if (hits > P.bestHits) {
    P.bestHits = hits;
    P.lastProgress = performance.now();
    document.getElementById("hintBtn")?.classList.remove("glow");
  }
  P.hits = hits;
  if (P.mode === "tide") return;
  const bar = document.getElementById("bar");
  if (!bar) return;
  bar.classList.toggle("held", P.phase === "clear");
  bar.querySelector("i").style.transform = `scaleX(${hits / (P.N * P.N)})`;
}
function setNote(text) {
  const n = document.getElementById("note");
  if (!n) return;
  n.hidden = !text;
  n.textContent = text || "";
}
function renderFooter() {
  const f = document.getElementById("footer");
  if (!f) return;
  const tools = document.getElementById("tools");
  if (tools) tools.hidden = P.phase !== "play";
  const streak = document.getElementById("streak");
  if (streak && P.mode === "tide") streak.textContent = P.woven === 0 ? "" : `${P.woven} in a row`;
  if (P.mode === "zen") {
    f.innerHTML = `<div class="row"><button class="pill" data-a="fresh">Fresh cloth</button><button class="pill ink" data-a="settle">Settle</button></div>`;
    return;
  }
  if (P.phase === "play") {
    f.innerHTML = "";
    return;
  }
  if (P.mode === "level") {
    const hasNext = P.idx + 1 < TOTAL;
    f.innerHTML = `<div class="result">${[1, 2, 3].map((x) => starSvg(x <= P.earned)).join("")}</div>
    <div class="row"><button class="pill" data-a="replay">Again</button>${hasNext ? `<button class="pill ink" data-a="nextLevel">${P.idx % PER === PER - 1 ? chapterName(P.ch + 1) : "Next cloth"}</button>` : `<button class="pill ink" data-a="levels">Levels</button>`}</div>`;
  } else if (P.mode === "daily") {
    f.innerHTML = `<div class="row"><button class="pill ink" data-a="room">Back to the room</button></div>`;
  } else if (P.phase === "clear") {
    f.innerHTML = `<div class="row"><button class="pill ink" data-a="tideNext">Next cloth</button></div>`;
  } else {
    f.innerHTML = `<div class="row"><button class="pill" data-a="room">Room</button><button class="pill ink" data-a="tide">Again</button></div>`;
  }
  requestAnimationFrame(() => {
    const r = f.getBoundingClientRect();
    if (r.bottom > window.innerHeight - 8) app.scrollTo({ top: app.scrollTop + r.bottom - window.innerHeight + 16, behavior: "smooth" });
  });
}
function afterChange(changed, gift = -1) {
  renderStitch(changed, gift);
  renderMine();
  renderProgress();
  renderTools();
  if (P.mode === "zen") {
    renderCloth();
    save.draft = { id: "draft", N: P.N, pal: P.pal, cells: cloneStamp(P.stamp) };
    clearTimeout(afterChange._t);
    afterChange._t = setTimeout(persist, 400);
  } else checkWin();
}
function pushPast() {
  P.past.push(cloneStamp(P.stamp));
  if (P.past.length > 80) P.past.shift();
}

function bindStitch() {
  const el = document.getElementById("stitch");
  el.addEventListener("pointerdown", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell || P.phase !== "play") return;
    e.preventDefault();
    stroke = { painted: new Set(), pushed: false };
    try {
      el.setPointerCapture(e.pointerId);
    } catch (err) {}
    paintAt(Number(cell.dataset.i), true);
  });
  el.addEventListener("pointermove", (e) => {
    if (!stroke || P.phase !== "play") return;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const cell = hit && hit.closest ? hit.closest(".cell") : null;
    if (cell && el.contains(cell)) {
      const i = Number(cell.dataset.i);
      if (!stroke.painted.has(i)) paintAt(i, false);
    }
  });
  const end = () => {
    stroke = null;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
function paintAt(i, first) {
  const cur = P.stamp[i];
  const b = brushCell();
  stroke.painted.add(i);
  if (first && !P.erasing && P.sym === "none" && cur.m === b.m && visualKey(cur) === visualKey(b) && LOOK[b.m].facings.length > 1) {
    const f = LOOK[b.m].facings;
    const np = f[LOOK[b.m].look[ROT_POSE[cur.p]]];
    pushPast();
    stroke.pushed = true;
    P.stamp[i] = { ...cur, p: np };
    P.brush.poses[b.m] = np;
    Sound.turn();
    haptic(6);
    afterChange([i]);
    return;
  }
  const next = paintStamp(P.stamp, P.N, i, b, P.sym);
  const changed = [];
  next.forEach((c, k) => {
    if (visualKey(c) !== visualKey(P.stamp[k])) changed.push(k);
  });
  if (!changed.length) return;
  if (!stroke.pushed) {
    pushPast();
    stroke.pushed = true;
  }
  P.stamp = next;
  if (P.erasing) Sound.erase();
  else Sound.tap(i);
  haptic(5);
  afterChange(changed);
}
function checkWin() {
  if (!P.target || P.phase !== "play") return;
  if (P.hits !== P.N * P.N) return;
  P.phase = "clear";
  stopLoops();
  Sound.win();
  haptic([12, 50, 24]);
  announce("The stitch holds");
  setNote("The stitch holds.");
  if (P.mode === "level") {
    const s = 3 - Math.min(2, P.hints);
    save.stars[P.idx] = Math.max(save.stars[P.idx] || 0, s);
    P.earned = s;
    persist();
  } else if (P.mode === "daily") {
    if (!save.daily.done[P.key]) {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      save.daily.streak = save.daily.last === dateKey(y) ? save.daily.streak + 1 : 1;
      save.daily.last = P.key;
      save.daily.done[P.key] = 1;
      const keys = Object.keys(save.daily.done).sort();
      while (keys.length > 60) delete save.daily.done[keys.shift()];
      persist();
    }
    const r = document.getElementById("right");
    if (r) r.textContent = save.daily.streak === 1 ? "1 day" : `${save.daily.streak} days in a row`;
  } else if (P.mode === "tide") {
    P.woven += 1;
    if (P.woven > save.tideBest) {
      save.tideBest = P.woven;
      persist();
    }
    const r = document.getElementById("right");
    if (r) r.textContent = "Held";
    const bar = document.getElementById("bar");
    if (bar) bar.classList.add("held");
  }
  renderStitch();
  renderProgress();
  renderTools();
  renderFooter();
}
function tideLoop() {
  const bar = document.getElementById("bar");
  const fill = bar && bar.querySelector("i");
  const right = document.getElementById("right");
  const total = P.seconds * 1000;
  let shown = -1;
  const step = () => {
    if (!P || P.mode !== "tide" || P.phase !== "play") return;
    const remain = P.endsAt - performance.now();
    if (fill) fill.style.transform = `scaleX(${Math.max(0, remain / total)})`;
    const urgent = remain < 10000;
    if (bar) bar.classList.toggle("urgent", urgent);
    const secs = Math.max(0, Math.ceil(remain / 1000));
    if (secs !== shown && right) {
      shown = secs;
      right.textContent = clock(secs);
      right.classList.toggle("urgent", urgent);
    }
    if (remain <= 0) {
      if (P.hits === P.N * P.N) return checkWin();
      P.phase = "over";
      Sound.fail();
      haptic(40);
      setNote(`Time. ${P.hits} of ${P.N * P.N} lined up.`);
      if (right) right.textContent = "Time";
      const memo = document.getElementById("memo");
      if (memo) {
        memo.hidden = false;
        memo.innerHTML = `<div class="thumb">${clothSVG(P.target, P.N, P.pal, 1)}</div><span class="small">The stitch, for next time.</span>`;
      }
      renderStitch();
      renderTools();
      renderFooter();
      return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function useHint() {
  if (!P || P.phase !== "play" || !P.target) return;
  const N = P.N;
  const sh = bestShift(P.stamp, P.target, N);
  const wrong = [];
  for (let i = 0; i < N * N; i++) {
    const want = P.target[srcIndex(i, N, sh)];
    if (visualKey(P.stamp[i]) !== visualKey(want)) wrong.push([i, want]);
  }
  if (!wrong.length) return;
  wrong.sort((a, b) => (b[1].m ? 1 : 0) - (a[1].m ? 1 : 0));
  const [i, want] = wrong[0];
  pushPast();
  P.stamp[i] = { ...want };
  P.hints += 1;
  Sound.hint();
  haptic(8);
  document.getElementById("hintBtn")?.classList.remove("glow");
  if (want.m && P.tray.includes(want.m)) {
    P.brush.m = want.m;
    P.brush.c = want.c;
    P.brush.poses[want.m] = want.p;
    P.erasing = false;
  }
  afterChange([i], i);
}

/* ---------- sound sheet */
function soundSheet() {
  closeOverlays();
  const s = save.settings;
  const tog = (key, label) => `<div class="set"><span>${label}</span><button class="toggle" role="switch" data-a="set" data-key="${key}" aria-checked="${!!s[key]}" aria-label="${label}"></button></div>`;
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Sound">
  <h2 class="title">Sound</h2>
  ${tog("music", "Music")}
  <div class="set"><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.05" value="${s.vol}" aria-label="Volume"></div>
  ${tog("fountain", "Fountain")}
  ${tog("sfx", "Effects")}
  ${navigator.vibrate ? tog("haptics", "Haptics") : ""}
  <div class="set"><span class="small">Kept on this device.</span><button class="pill plain" data-a="reset" style="color:var(--clay);padding:0 8px">Reset progress</button></div>
  <div style="margin-top:12px"><button class="pill ink wide" data-a="closeSheet">Done</button></div></div>`;
  document.body.appendChild(v);
  document.getElementById("vol").addEventListener("input", (e) => {
    save.settings.vol = Number(e.target.value);
    Sound.configure(save.settings);
    persist();
  });
}
function refreshSoundBtn() {
  const b = document.getElementById("soundBtn");
  if (b) b.innerHTML = soundOn() ? I.sound : I.mute;
}

/* ---------- export */
function exportImage(payload) {
  const px = 1600;
  const reps = payload.N === 2 ? 6 : payload.N === 3 ? 4 : 3;
  const svg = clothSVG(payload.cells, payload.N, payload.pal, reps, { px });
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = cv.height = px;
    cv.getContext("2d").drawImage(img, 0, 0, px, px);
    URL.revokeObjectURL(url);
    cv.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], payload.name + ".png", { type: "image/png" });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, "image/png");
  };
  img.src = url;
}

/* ---------- actions */
const VIEWS = { room: roomView, levels: levelsView, gallery: galleryView, detail: detailView, play: playView };
const ACTIONS = {
  continue() {
    const n = nextLevel();
    if (n < 0) go("levels");
    else startLevel(n);
  },
  room: () => {
    D = null;
    go("room");
  },
  levels: () => go("levels"),
  gallery: () => go("gallery"),
  zen: () => {
    D = null;
    startZen();
  },
  daily: () => startDaily(),
  tide: () => startTide(0, 0),
  tideNext: () => startTide(P.round + 1, P.woven),
  sound: () => soundSheet(),
  closeSheet: () => closeOverlays(),
  level: (el) => startLevel(Number(el.dataset.i)),
  replay: () => startLevel(P.idx),
  nextLevel: () => startLevel(P.idx + 1),
  hint: () => useHint(),
  detail(el) {
    D = { src: el.dataset.src, k: Number(el.dataset.k) };
    go("detail");
  },
  openZen() {
    if (D && D.payload) startZen({ N: D.payload.N, pal: D.payload.pal, cells: D.payload.cells });
  },
  export() {
    if (D && D.payload) exportImage(D.payload);
  },
  remove(el) {
    const box = document.getElementById("removeBox");
    box.innerHTML = `<button class="pill warn" data-a="removeYes">Remove</button> <button class="pill plain" data-a="removeNo">Keep</button>`;
  },
  removeYes() {
    save.designs.splice(D.k, 1);
    persist();
    D = null;
    go("gallery");
  },
  removeNo: () => detailView(),
  motif(el) {
    P.brush.m = el.dataset.m;
    P.erasing = false;
    Sound.ui();
    haptic(4);
    renderTools();
  },
  face(el) {
    P.brush.poses[P.brush.m] = Number(el.dataset.p);
    P.erasing = false;
    Sound.turn();
    haptic(4);
    renderTools();
  },
  erase() {
    P.erasing = !P.erasing;
    Sound.ui();
    renderTools();
  },
  color(el) {
    P.brush.c = Number(el.dataset.c);
    P.erasing = false;
    Sound.ui();
    haptic(4);
    renderTools();
  },
  undo() {
    if (!P || !P.past.length || P.phase !== "play") return;
    P.stamp = P.past.pop();
    Sound.erase();
    afterChange([]);
  },
  sym(el) {
    P.sym = el.dataset.sym;
    document.querySelectorAll('[data-a="sym"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sym === P.sym)));
    Sound.ui();
  },
  size(el) {
    const n = Number(el.dataset.n);
    if (n === P.N) return;
    P.N = n;
    P.stamp = emptyStamp(n);
    P.past = [];
    Sound.ui();
    playView();
    afterChange([]);
  },
  pal(el) {
    P.pal = el.dataset.pal;
    document.querySelectorAll('[data-a="pal"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pal === P.pal)));
    Sound.ui();
    afterChange([]);
  },
  fresh() {
    if (!P.stamp.some((c) => c.m)) return;
    pushPast();
    P.stamp = emptyStamp(P.N);
    Sound.erase();
    haptic(10);
    afterChange([]);
  },
  settle() {
    if (!P.stamp.some((c) => c.m)) return;
    const same = save.designs.find((d) => d.pal === P.pal && d.N === P.N && canonicalKey(d.cells, d.N) === canonicalKey(P.stamp, P.N));
    if (!same) {
      save.designs.unshift({ id: "d" + Date.now().toString(36), N: P.N, pal: P.pal, cells: cloneStamp(P.stamp), at: Date.now() });
      save.designs = save.designs.slice(0, 80);
      persist();
    }
    Sound.win();
    haptic([8, 30, 8]);
    toast("Folded into the gallery");
  },
  set(el) {
    const key = el.dataset.key;
    save.settings[key] = !save.settings[key];
    el.setAttribute("aria-checked", String(save.settings[key]));
    Sound.configure(save.settings);
    persist();
    refreshSoundBtn();
  },
  reset(el) {
    if (!el.classList.contains("armed")) {
      el.classList.add("armed");
      el.textContent = "Tap again to reset";
      return;
    }
    const settings = save.settings;
    save = defaults();
    save.settings = settings;
    persist();
    closeOverlays();
    go("room");
    toast("Progress cleared");
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) {
    if (e.target.classList && e.target.classList.contains("veil")) closeOverlays();
    return;
  }
  const fn = ACTIONS[el.dataset.a];
  if (fn) fn(el);
});
let resizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (screen === "play") renderMine();
  }, 120);
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && screen === "play") {
    e.preventDefault();
    ACTIONS.undo();
  }
  if (e.key === "Escape") closeOverlays();
});
const unlockAudio = () => Sound.init();
["pointerdown", "touchend", "click", "keydown"].forEach((t) => document.addEventListener(t, unlockAudio, { capture: true, passive: true }));

function boot() {
  computeLooks();
  buildLevels();
  Sound.configure(save.settings);
  go("room");
  const sp = document.getElementById("splash");
  if (sp) {
    sp.style.opacity = "0";
    setTimeout(() => sp.remove(), 550);
  }
}
boot();
if (window.__SEREIN_TEST__) window.__serein = { clothSVG, LEVELS, LOOK, MOTIF_LIST, visualKey, bestShift, canonicalKey, CHAPTERS, startLevel, startZen, startDaily, startTide, go, get P() { return P; }, get save() { return save; } };

})();
